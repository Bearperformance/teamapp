// ─── HELPERS ───
const uid = () => Math.random().toString(36).slice(2,10);
const initials = n => (n||'').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const getTodayStr = () => new Date().toISOString().slice(0,10);
const getTeam = id => S.teams.find(t=>t.id===id);
const getAccessTeamIds = () => S.user?.role==='admin' ? S.teams.map(t=>t.id) : (S.user?.teamIds||[]);
const getAccessTrainings = () => S.trainings.filter(t=>getAccessTeamIds().includes(t.teamId)).sort((a,b)=>a.date.localeCompare(b.date)||a.startTime.localeCompare(b.startTime));
const getAtt = (tId,pId) => S.attendance.find(a=>a.trainingId===tId&&a.playerId===pId)||{status:'unknown',reason:'',note:'',minutes:null,excused:null};
// excused: null=not set, true=entschuldigt, false=unentschuldigt
const isPresent = s => s==='present'||s==='late';
const tIds_access = () => { if(!S.user) return []; if(S.user.role==='admin') return S.teams.map(t=>t.id); return S.user.teamIds||[]; };
const coachesForTeam = teamId => S.coaches.filter(c=>c.role!=='admin'&&(c.teamIds||[]).includes(teamId));
const isGame = t => t&&(t.type==='Spiel'||t.type.toLowerCase().includes('spiel')||t.type.toLowerCase().includes('game'));
// Langzeit-Status: returns active status object or null
const LONG_STATUS_LABELS={'injury':'🩹 Verletzt','vacation':'🏖 Urlaub','absent':'🚫 Abwesend','ill':'🤒 Krank'};
function getLongStatus(pId){
  const p=S.players.find(x=>x.id===pId);
  if(!p||!p.longStatus||p.longStatus==='none') return null;
  return {status:p.longStatus, label:LONG_STATUS_LABELS[p.longStatus]||p.longStatus, since:p.longStatusSince||'', note:p.longStatusNote||'', endDate:p.longStatusEndDate||'', decision:p.longStatusDecision||''};
}
const typeColor = t => isGame(t)?'#e05555':'var(--y)';
const typeIcon2 = t => isGame(t)?'⚽':t.type.includes('Athletik')?'🏃':'🏋️';

function formatDate(str){
  if(!str) return '';
  const d=new Date(str+'T12:00:00');
  return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
}
function calcAge(b){
  if(!b) return '-';
  return Math.floor((Date.now()-new Date(b))/(365.25*24*3600*1000))+' J';
}
function showLoading(m='Laden…'){
  document.getElementById('loading-overlay').style.display='flex';
  document.getElementById('loading-msg').textContent=m;
}
function hideLoading(){ document.getElementById('loading-overlay').style.display='none'; }
function showToast(m,t='ok'){
  const el=document.getElementById('toast');
  el.textContent=m; el.className='show '+(t==='err'?'err':'');
  clearTimeout(el._t); el._t=setTimeout(()=>el.className='',2500);
}

// ─── FIREBASE OPS ───
async function fbAdd(coll,data){ const r=await fbDb.collection(coll).add(data); return r.id; }
async function fbUpdate(coll,id,data){ await fbDb.collection(coll).doc(id).update(data); }
async function fbDelete(coll,id){ await fbDb.collection(coll).doc(id).delete(); }

async function loadAll(){
  showLoading('Daten laden…');
  try {
    const [te,co,pl,tr,at]=await Promise.all([
      fbDb.collection('teams').get(),
      fbDb.collection('coaches').get(),
      fbDb.collection('players').get(),
      fbDb.collection('trainings').get(),
      fbDb.collection('attendance').get()
    ]);
    S.teams=te.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
    S.coaches=co.docs.map(d=>({id:d.id,...d.data()}));
    S.players=pl.docs.map(d=>({id:d.id,...d.data()}));
    S.trainings=tr.docs.map(d=>({id:d.id,...d.data()}));
    S.attendance=at.docs.map(d=>({id:d.id,...d.data()}));
    if(S.teams.length===0) await seedDefault();
    // Always inject Demo U16 team locally (never in Firebase)
    injectDemoTeam();
  } catch(e){ showToast('Firebase Fehler: '+e.message,'err'); }
  hideLoading();
}

function injectDemoTeam(){
  const DEMO_ID='__demo_u16__';
  // Remove old demo if exists, re-add fresh
  S.teams=S.teams.filter(t=>t.id!==DEMO_ID);
  S.players=S.players.filter(p=>p.teamId!==DEMO_ID);
  S.trainings=S.trainings.filter(t=>t.teamId!==DEMO_ID);
  S.attendance=S.attendance.filter(a=>!a.trainingId.startsWith('__demo'));
  // Add demo team
  S.teams.push({id:DEMO_ID,name:'Demo U16',color:'#f5c518',isDemo:true});
  S.teams.sort((a,b)=>a.name.localeCompare(b.name));
  // Add demo players with new teamId
  DEMO_PLAYERS.forEach(p=>S.players.push({...p,id:'__demo_p_'+p.id,teamId:DEMO_ID}));
  // Add demo trainings with new IDs
  DEMO_TRAININGS.forEach(t=>S.trainings.push({...t,id:'__demo_t_'+t.id,teamId:DEMO_ID}));
  // Add demo attendance with remapped IDs
  DEMO_ATTENDANCE.forEach(a=>S.attendance.push({
    ...a,
    id:'__demo_a_'+a.id,
    trainingId:'__demo_t_'+a.trainingId,
    playerId:'__demo_p_'+a.playerId
  }));
}

async function seedDefault(){
  showLoading('Ersteinrichtung…');
  const defaultTeams=[
    {name:'U10',color:'#f5c518'},{name:'U11',color:'#f5c518'},{name:'U12',color:'#f5c518'},
    {name:'U13',color:'#f5c518'},{name:'U14',color:'#f5c518'},{name:'U15',color:'#f5c518'},
    {name:'U16',color:'#f5c518'},{name:'U17',color:'#f5c518'},{name:'U18',color:'#f5c518'},{name:'NWZ U18 26/27',color:'#6366f1'},
  ];
  let u14Id=null;
  for(const t of defaultTeams){
    const id=await fbAdd('teams',t);
    S.teams.push({id,...t});
    if(t.name==='U14') u14Id=id;
  }
  // Add today's training for U14 + all players
  if(u14Id){
    const todayTr={teamId:u14Id,type:'Training',date:'2026-04-20',meetTime:'17:15',startTime:'17:30',endTime:'19:00',location:'Sportplatz'};

const EXCEL_UPDATE_DATE = '2026-05-04';

async function setupAllTeamsFromExcel(){
  showLoading('Spielerdaten werden synchronisiert…');
  let updated = 0, added = 0;
  
  for(const [teamName, players] of Object.entries(EXCEL_PLAYER_DATA)){
    const team = S.teams.find(t=>t.name===teamName);
    if(!team) continue;
    
    for(const pd of players){
      // Find existing player by name (fuzzy match)
      const existing = S.players.find(p=>
        p.teamId===team.id &&
        p.name.toLowerCase().replace(/[^a-z]/g,'').includes(
          pd.name.toLowerCase().replace(/[^a-z]/g,'').slice(0,6)
        )
      );
      
      const updateData = {
        height: pd.height||0,
        weight: pd.weight||0,
        growthStatus: pd.growthStatus||0,
        phvCritical: pd.phvCritical||false,
        dataNote: pd.dataNote||'',
        lastDataUpdate: EXCEL_UPDATE_DATE,
      };
      if(pd.birthdate) updateData.birthdate = pd.birthdate;
      
      if(existing){
        await fbUpdate('players', existing.id, updateData);
        Object.assign(existing, updateData);
        updated++;
      } else {
        const newPlayer = {
          name: pd.name,
          birthdate: pd.birthdate||'',
          trikot: pd.trikot||'',
          notes: '',
          teamId: team.id,
          ...updateData
        };
        const nid = await fbAdd('players', newPlayer);
        S.players.push({id:nid, ...newPlayer});
        added++;
      }
    }
  }
  
  hideLoading();
  showToast(`Sync: ${updated} aktualisiert, ${added} neu hinzugefügt ✓`);
  renderPlayersList();
  renderDashboard();
}


// ─── INTERNAL VERIFY SYSTEM ───
window.runVerify=function(){
  const checks=[];
  // Check all teams have players
  for(const team of S.teams){
    const count=S.players.filter(p=>p.teamId===team.id).length;
    checks.push({ok:count>0||team.name==='Demo U16'||team.name==='U10'||team.name==='U11',
      msg:`${team.name}: ${count} Spieler`});
  }
  // Check no duplicate players
  const names=S.players.map(p=>p.teamId+'_'+p.name.toLowerCase());
  const dupes=names.filter((n,i)=>names.indexOf(n)!==i);
  checks.push({ok:dupes.length===0, msg:`Duplikate: ${dupes.length===0?'Keine':dupes.join(', ')}`});
  // Check Roko not in U14
  const u14=S.teams.find(t=>t.name==='U14');
  const roko=u14&&S.players.find(p=>p.teamId===u14.id&&p.name==='Roko Granic');
  checks.push({ok:!roko, msg:`Roko Granic in U14: ${roko?'⚠️ NOCH DA':'✓ Entfernt'}`});
  // Report
  const report=checks.map(c=>`${c.ok?'✅':'❌'} ${c.msg}`).join('\n');
  alert('VERIFY REPORT:\n\n'+report);
};

// ─── AUTH (v9.4 robust) ───
async function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  if(!u||!p){ document.getElementById('login-error').textContent='Bitte Benutzername und Passwort eingeben.'; document.getElementById('login-error').style.display='block'; return; }
  document.getElementById('login-error').style.display='none';
  showLoading('Anmelden…');
  try {
    // 1) Daten laden mit 12s Timeout (verhindert Endlos-Spinner bei Firebase-Block)
    const loadWithTimeout = Promise.race([
      loadAll(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout: Firebase nicht erreichbar (Adblocker? Internet?)')), 12000))
    ]);
    await loadWithTimeout;
    // 2) Coach finden
    const coach=S.coaches.find(c=>c.username===u&&c.password===p);
    if(!coach){ hideLoading(); document.getElementById('login-error').textContent='Benutzername oder Passwort falsch.'; document.getElementById('login-error').style.display='block'; return; }
    // 3) UI umschalten
    S.user=coach;
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('hdr-role').textContent=coach.role==='admin'?'Head Coach – Alle Teams':'Trainer – '+(coach.teamIds||[]).map(id=>getTeam(id)?.name||'').filter(Boolean).join(', ');
    if(coach.role==='admin') document.getElementById('nav-admin').style.display='flex';
    // 4) Default-Team setzen (sicher gegen leere Trainer-Teams)
    const ids=getAccessTeamIds();
    const firstId = ids[0] || null;

// ─── DASHBOARD ───
function renderDashboard(){
  const today=getTodayStr();
  const todayDate=new Date(today+'T12:00:00');

  // ── BIRTHDAY CHECK: next 10 days ──
  const bdayHtml=(()=>{
    const upcoming=[];
    const tIds=tIds_access();
    for(const p of S.players){
      if(!tIds.includes(p.teamId)) continue;
      if(!p.birthdate) continue;
      const bd=new Date(p.birthdate+'T12:00:00');
      // Set birthday to this year
      const bdThisYear=new Date(todayDate.getFullYear(), bd.getMonth(), bd.getDate());
      // If already passed this year, check next year
      let diff=Math.round((bdThisYear-todayDate)/(1000*60*60*24));
      if(diff<0){
        const bdNextYear=new Date(todayDate.getFullYear()+1, bd.getMonth(), bd.getDate());
        diff=Math.round((bdNextYear-todayDate)/(1000*60*60*24));
      }
      if(diff>=0&&diff<=10){
        const team=getTeam(p.teamId);
        const bdStr=bdThisYear<todayDate
          ? new Date(todayDate.getFullYear()+1,bd.getMonth(),bd.getDate()).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})
          : bdThisYear.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
        const newAge=todayDate.getFullYear()-(diff<0?-1:0)-bd.getFullYear()+(diff<0?1:0);
        upcoming.push({name:p.name,diff,bdStr,team:team?.name||'',newAge});
      }
    }
    if(!upcoming.length) return '';
    upcoming.sort((a,b)=>a.diff-b.diff);
    return `<div class="bday-section">
      <div class="dash-section-header" style="margin-bottom:8px">
        <span style="font-size:14px">🎂</span>
        <span class="dash-section-label">Geburtstage</span>
        <span class="dash-section-line"></span>
      </div>
      <div class="bday-list">
        ${upcoming.map(b=>`<div class="bday-item">
          <div class="bday-cake">${b.diff===0?'🎉':'🎂'}</div>
          <div class="bday-info">
            <div class="bday-name">${b.name} <span class="bday-age">${b.newAge} Jahre</span></div>
            <div class="bday-meta">${b.team} · ${b.diff===0?'<b style="color:var(--y)">Heute!</b>':b.diff===1?'Morgen':b.bdStr+' (in '+b.diff+' Tagen)'}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  })();

  // Get end of this week (Sunday)
  const now=new Date();
  const dayOfWeek=now.getDay(); // 0=Sun, 1=Mon...
  const daysToSunday=dayOfWeek===0?0:7-dayOfWeek;
  const weekEnd=new Date(now); weekEnd.setDate(now.getDate()+daysToSunday);
  const weekEndStr=weekEnd.toISOString().slice(0,10);

  const allTrs=getAccessTrainings().filter(t=>t.date>=today);
  const thisWeek=allTrs.filter(t=>t.date<=weekEndStr);
  const later=allTrs.filter(t=>t.date>weekEndStr).slice(0,20);

  const el=document.getElementById('dashboard-trainings');
  if(!allTrs.length){el.innerHTML='<div class="empty-state"><div class="icon">📅</div><p>Keine bevorstehenden Termine</p></div>';return;}

  function trainingCard(t){
    const team=getTeam(t.teamId);
    const pl=S.players.filter(p=>p.teamId===t.teamId);
    const pr=pl.filter(p=>{const ls=getLongStatus(p.id);const s=getAtt(t.id,p.id).status;return isPresent(ls&&s!=='present'&&s!=='late'?'absent':s);}).length;
    const ab=pl.filter(p=>{const ls=getLongStatus(p.id);const s=getAtt(t.id,p.id).status;return (ls&&s!=='present'&&s!=='late'?'absent':s)==='absent';}).length;
    const isToday=t.date===today;
    const typeIcon=t.type.includes('Spiel')?'⚽':t.type.includes('Athletik')?'🏃':'🏋️';
    return `<div class="training-card" onclick="openAttDetail('${t.id}')">
      <div class="tc-header">
        <div class="tc-left">
          <span class="tc-icon">${typeIcon}</span>
          <div><div class="tc-type">${t.type}</div><div class="tc-team">${team?.name||''}</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="tc-badge${isToday?' today':isGame(t)?' game':''}">${isToday?'HEUTE':formatDate(t.date)}</div>
          <button onclick="event.stopPropagation();deleteTrainingFromCard('${t.id}')" style="background:rgba(224,85,85,0.15);border:1px solid rgba(224,85,85,0.3);border-radius:6px;padding:4px 7px;color:#ff8080;font-size:11px;cursor:pointer">🗑</button>
        </div>
      </div>
      <div class="tc-body">
        <div class="tc-times">
          <div class="tc-time"><span>${t.meetTime||''}</span><label>Treffen</label></div>
          <div class="tc-time"><span>${t.startTime||''}</span><label>Beginn</label></div>
          <div class="tc-time"><span>${t.endTime||''}</span><label>Ende</label></div>
          ${t.location?`<div class="tc-time"><span style="font-size:10px">${t.location}</span><label>Ort</label></div>`:''}
        </div>
        <div class="tc-stats">
          <div class="tc-stat y">✓ ${pr}</div>
          <div class="tc-stat r">✗ ${ab}</div>
          <div class="tc-stat g">? ${pl.length-pr-ab}</div>
          <div class="tc-stat g">👥 ${pl.length}</div>
        </div>
      </div>
    </div>`;
  }

  let html=bdayHtml;
  if(thisWeek.length){
    html+=`<div class="dash-section-header">
      <span class="dash-section-dot today-dot"></span>
      <span class="dash-section-label">Diese Woche</span>
      <span class="dash-section-line"></span>
    </div>`;
    html+=thisWeek.map(trainingCard).join('');
  }
  if(later.length){
    html+=`<div class="dash-section-header" style="margin-top:20px">
      <span class="dash-section-dot later-dot"></span>
      <span class="dash-section-label">Nächste Woche & später</span>
      <span class="dash-section-line"></span>
    </div>`;
    html+=later.map(trainingCard).join('');
  }
  el.innerHTML=html;
}

          <div class="tc-time"><span>${t.endTime||''}</span><label>Ende</label></div>

window.deleteTrainingFromCard=async function(tId){
  const t=S.trainings.find(x=>x.id===tId);
  if(!t) return;
  const team=getTeam(t.teamId);
  if(!confirm('Training "'+t.type+' – '+(team?.name||'')+'" am '+fmtD(t.date)+' löschen?')) return;
  if(!confirm('⚠️ ENDGÜLTIG löschen?')) return;
  showL('Löschen…');
  try{
    await fbDel('trainings',tId);
    S.trainings=S.trainings.filter(tr=>tr.id!==tId);
    const attSnap=await fbDb.collection('attendance').where('trainingId','==',tId).get();
    const batch=fbDb.batch();
    attSnap.docs.forEach(d=>batch.delete(d.ref));
    if(attSnap.docs.length>0) await batch.commit();
    S.attendance=S.attendance.filter(a=>a.trainingId!==tId);

            ${att.excused===true?'<span class="excused-badge">✓ Entschuldigt</span>':att.excused===false&&(effStatus==='absent'||effStatus==='late')?'<span class="unexcused-badge">✗ Unentschuldigt</span>':''}

window.toggleExcused=async function(tId,pId){
  const att=getAtt(tId,pId);
  // Cycle: null → true (entschuldigt) → false (unentschuldigt) → null
  const next = att.excused===null||att.excused===undefined ? true : att.excused===true ? false : null;
  await saveAtt(tId,pId,{...att, excused:next});
  renderAttDetailPlayers(tId);
};
window.setLate=async function(tId,pId){
  const att=getAtt(tId,pId);
  if(att.status!=='late'){
    // First press: late + unexcused
    await saveAtt(tId,pId,{status:'late',reason:'Zu spät',note:att.note||'',excused:false});
  } else if(att.excused===false||att.excused===null||att.excused===undefined){
    // Second press: late + excused (green)
    await saveAtt(tId,pId,{status:'late',reason:'Zu spät',note:att.note||'',excused:true});
  } else {
    // Third press: reset
    await saveAtt(tId,pId,{status:'unknown',reason:'',note:'',excused:null});
  }
  renderAttDetailPlayers(tId);
};
window.setPresent=async function(tId,pId){
  const att=getAtt(tId,pId);
  const ns=att.status==='present'?'unknown':'present';
  await saveAtt(tId,pId,{status:ns,reason:'',note:att.note||''});
  renderAttDetailPlayers(tId);
};
window.setAbsent=function(tId,pId){
  const att=getAtt(tId,pId);
  const ls=getLongStatus(pId);
  // If currently absent (either manual or longStatus), clicking X resets
  if(att.status==='absent'&&!ls){saveAtt(tId,pId,{status:'unknown',reason:'',note:''}).then(()=>renderAttDetailPlayers(tId));return;}
  if(ls&&att.status!=='present'&&att.status!=='late'){
    // Already auto-absent via longStatus
    // Open reason modal with pre-filled reason from longStatus
    S.pendingPId=pId;
    S.pendingTId=tId;
    const p2=S.players.find(x=>x.id===pId);
    document.getElementById('reason-title').textContent=(p2?.name||'Spieler')+' – Abwesenheitsgrund';
    document.getElementById('reason-note').value=att.note||p2?.longStatusNote||'';
    const chips=['Verletzung','Krank','Schule/Arbeit','Urlaub','Privat','Gesperrt','Andere'];
    // Pre-select chip based on longStatus
    const lsChipMap={'injury':'Verletzung','ill':'Krank','vacation':'Urlaub','absent':'Andere'};
    const preChip=lsChipMap[ls.status]||'';
    document.getElementById('reason-chips').innerHTML=chips.map(chip=>
      `<div class="rchip${(att.reason||preChip)===chip?' sel':''}" onclick="selChip(this)">${chip}</div>`
    ).join('');
    document.getElementById('excused-toggle').innerHTML='';
    document.getElementById('long-status-toggle').innerHTML='';
    openModal('reason-modal');
    return;
  }
  S.pendingPId=pId;
  S.pendingTId=tId;
  const p=S.players.find(x=>x.id===pId);

    `<div class="rchip${att.reason===chip?' sel':''}" onclick="selChip(this)">${chip}</div>`
  ).join('');

  document.getElementById('excused-toggle').innerHTML=`
    <div class="excused-wrap">
      <div class="excused-title">📋 Entschuldigt?</div>
      <div class="excused-opts">
        <div class="excused-opt${att.excused===null||att.excused===undefined?' sel-exc':''}" data-exc="null" onclick="selExc(this)">— Nicht festgelegt</div>
        <div class="excused-opt${att.excused===true?' sel-exc':''}" data-exc="yes" onclick="selExc(this)">✓ Entschuldigt</div>
        <div class="excused-opt${att.excused===false?' sel-exc':''}" data-exc="no" onclick="selExc(this)">✗ Unentschuldigt</div>
      </div>
    </div>`;
  document.getElementById('long-status-toggle').innerHTML=`
    <div class="ls-toggle-wrap">

window.selExc=function(el){
  document.querySelectorAll('.excused-opt').forEach(x=>x.classList.remove('sel-exc'));
  el.classList.add('sel-exc');
};
window.selLs=function(el){
  document.querySelectorAll('.ls-opt').forEach(x=>x.classList.remove('sel-ls'));
  el.classList.add('sel-ls');
};
async function saveAtt(tId,pId,data){
  const ex=S.attendance.find(a=>a.trainingId===tId&&a.playerId===pId);
  const pay={trainingId:tId,playerId:pId,...data};
  if(ex){ await fbUpdate('attendance',ex.id,data); Object.assign(ex,data); }
  else { const nid=await fbAdd('attendance',pay); S.attendance.push({id:nid,...pay}); }
}
window.selChip=function(el){
  document.querySelectorAll('.rchip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  // Auto-select Entschuldigt when reason chosen
  document.querySelectorAll('.excused-opt').forEach(x=>x.classList.remove('sel-exc'));
  const yesOpt=document.querySelector('.excused-opt[data-exc="yes"]');
  if(yesOpt) yesOpt.classList.add('sel-exc');
};
window.saveAbsence=async function(){
  if(!S.curTrainingId||!S.pendingPId) return;
  const sc=document.querySelector('.rchip.sel');
  const reason=sc?sc.textContent:'';
  const note=document.getElementById('reason-note').value.trim();
  const lsEl=document.querySelector('.ls-opt.sel-ls');
  const lsVal=lsEl?lsEl.dataset.ls:'none';
  // Get excused selection from modal
  const excusedEl=document.querySelector('.excused-opt.sel-exc');
  const excusedVal=excusedEl?excusedEl.dataset.exc:null;
  const excused=excusedVal==='yes'?true:excusedVal==='no'?false:null;
  showLoading('Speichern…');
  // Save attendance for this training
  await saveAtt(S.curTrainingId,S.pendingPId,{status:'absent',reason,note,excused});
  // Save longStatus to player if not 'none'
  if(lsVal&&lsVal!=='none'){
    const today=new Date().toISOString().slice(0,10);
    await fbUpdate('players',S.pendingPId,{longStatus:lsVal,longStatusSince:today,longStatusNote:note});
    const pl=S.players.find(p=>p.id===S.pendingPId);
    if(pl){pl.longStatus=lsVal;pl.longStatusSince=today;pl.longStatusNote=note;}
  }
  hideLoading(); closeModal('reason-modal');
  renderAttDetailPlayers(S.curTrainingId); showToast('Gespeichert ✓');
};

window.saveLongStatus=async function(){
  const sel=document.querySelector('.ls-opt2.active');
  if(!sel) return;
  const val=sel.dataset.v;
  const note=document.getElementById('ls-note-input').value.trim();
  const today=new Date().toISOString().slice(0,10);
  showLoading('Speichern…');
  const endDate=document.getElementById('ls-end-date').value||'';
  const decEl=document.querySelector('.ls-dec-opt.active');
  const decision=decEl?decEl.dataset.d:'coach';
  const upd=val==='none'
    ?{longStatus:'none',longStatusSince:'',longStatusNote:'',longStatusEndDate:'',longStatusDecision:''}
    :{longStatus:val,longStatusSince:today,longStatusNote:note,longStatusEndDate:endDate,longStatusDecision:decision};
  // Only update real (non-demo) players in Firebase
  await fbUpdate('players',S.pendingPId,upd);
  const pl=S.players.find(p=>p.id===S.pendingPId);
  if(pl) Object.assign(pl,upd);
  hideLoading();
  closeModal('ls-modal');
  showToast(val==='none'?'Status aufgehoben ✓':'Langzeit-Status gesetzt ✓');

  if(S.pendingTId) renderAttDetailPlayers(S.pendingTId);
  renderPlayersList();
};
window.saveMinutes=async function(tId,pId,val){
  const mins=parseInt(val)||null;
  const ex=S.attendance.find(a=>a.trainingId===tId&&a.playerId===pId);
  if(ex){ex.minutes=mins; await fbUpdate('attendance',ex.id,{minutes:mins});}
};

function renderAnalytics(){
  if(!S.user) return;
  const ids=getAccessTeamIds();
  // Team selector
  const wrap=document.getElementById('analytics-team-sel-wrap');
  if(S.user.role==='admin'){
    wrap.style.display='block';
    document.getElementById('analytics-team-sel').innerHTML=S.teams.filter(t=>ids.includes(t.id)).map((t,i)=>
      `<div class="chip${i===0?' active':''}" onclick="setAnalyticsTeam('${t.id}',this)">${t.name}</div>`
    ).join('');
    S.analyticsTeamId=ids[0];
  } else { S.analyticsTeamId=ids[0]; }
  renderAnalyticsCharts();
}
window.setAnalyticsTeam=function(id,el){
  S.analyticsTeamId=id;
  document.querySelectorAll('#analytics-team-sel .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); renderAnalyticsCharts();
};
function renderAnalyticsCharts(){
  const tid=S.analyticsTeamId;
  if(!tid) return;
  const players=S.players.filter(p=>p.teamId===tid).sort((a,b)=>a.name.localeCompare(b.name));
  const trainings=S.trainings.filter(t=>t.teamId===tid).sort((a,b)=>a.date.localeCompare(b.date));

  if(!players.length||!trainings.length){
    document.getElementById('analytics-content').innerHTML='<div class="empty-state"><div class="icon">📊</div><p>Keine Daten für dieses Team</p></div>';
    return;
  }

  // Overall stats
  let avgAttPct=0;
  const pastTrainings=trainings.filter(t=>t.date<=getTodayStr());
  const totalSessions=pastTrainings.length;
  let playerStats=players.map(p=>{
    const pr=pastTrainings.filter(t=>isPresent(getAtt(t.id,p.id).status)).length;
    const late=pastTrainings.filter(t=>getAtt(t.id,p.id).status==='late').length;
    const ab=pastTrainings.filter(t=>getAtt(t.id,p.id).status==='absent').length;
    const pct=totalSessions?Math.round(pr/totalSessions*100):0;
    return {p,pr,ab,pct};
  });
  avgAttPct=playerStats.length?Math.round(playerStats.reduce((s,x)=>s+x.pct,0)/playerStats.length):0;

  // Per-training attendance over time
  // Last 3 weeks = trainings in past 21 days
  const todayStr=getTodayStr();
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-21);
  const cutoffStr=cutoff.toISOString().slice(0,10);
  // Only past/today trainings – never future
  const last12=trainings.filter(t=>t.date>=cutoffStr&&t.date<=todayStr).slice(-21);
  const timeLabels=last12.map(t=>{ const isG=isGame(t); return (isG?'⚽ ':'')+formatDate(t.date).split(' ').slice(0,2).join(' '); });
  const timeData=last12.map(t=>{
    const pl=players.length;
    const pr=players.filter(p=>isPresent(getAtt(t.id,p.id).status)).length;
    return pl?Math.round(pr/pl*100):0;
  });

  // Absence reasons
  const reasons={};
  S.attendance.filter(a=>players.find(p=>p.id===a.playerId)&&a.status==='absent'&&a.reason).forEach(a=>{
    reasons[a.reason]=(reasons[a.reason]||0)+1;
  });

  document.getElementById('analytics-content').innerHTML=`
    <div class="stats-row">
      <div class="stat-box"><div class="sb-val">${totalSessions}</div><div class="sb-lbl">Einheiten</div></div>
      <div class="stat-box"><div class="sb-val y">${avgAttPct}%</div><div class="sb-lbl">Ø Anwesenheit</div></div>
      <div class="stat-box"><div class="sb-val">${players.length}</div><div class="sb-lbl">Spieler</div></div>
    </div>

    <div class="section-title">Letzte 3 Wochen <span style="font-size:10px;color:var(--muted)">● Training ● Spiel</span></div>
    <div class="chart-screen">
      <div class="card chart-card"><canvas id="timeChart"></canvas></div>
    </div>

    <div class="chart-screen">
      <!-- Late analysis table -->
    ${(()=>{
      const lateStats=players.map(p=>({
        p,
        lateTotal:trainings.filter(t=>getAtt(t.id,p.id).status==='late').length,
        lateExcused:trainings.filter(t=>getAtt(t.id,p.id).status==='late'&&getAtt(t.id,p.id).excused===true).length,
        lateUnexcused:trainings.filter(t=>getAtt(t.id,p.id).status==='late'&&(getAtt(t.id,p.id).excused===false||getAtt(t.id,p.id).excused===null)).length,
      })).filter(x=>x.lateTotal>0).sort((a,b)=>b.lateTotal-a.lateTotal);
      if(!lateStats.length) return '';
      return '<div class="section-title">Verspätungen</div><div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="color:var(--muted);text-transform:uppercase;font-size:10px"><th style="text-align:left;padding:6px 4px">Spieler</th><th style="text-align:center;padding:6px 4px;color:#3b82f6">⌛ Ges.</th><th style="text-align:center;padding:6px 4px;color:#22c55e">Entsch.</th><th style="text-align:center;padding:6px 4px;color:var(--r)">Unentsch.</th></tr></thead><tbody>'+lateStats.map(x=>'<tr style="border-top:1px solid var(--border)"><td style="padding:7px 4px;font-weight:600">'+x.p.name+'</td><td style="text-align:center;padding:7px 4px;color:#3b82f6;font-weight:700">'+x.lateTotal+'</td><td style="text-align:center;padding:7px 4px;color:#22c55e">'+x.lateExcused+'</td><td style="text-align:center;padding:7px 4px;color:var(--r)">'+x.lateUnexcused+'</td></tr>').join('')+'</tbody></table></div>';
    })()}
    <div class="section-title">Spieler-Anwesenheit</div>
      <div class="card chart-card"><canvas id="playerChart"></canvas></div>
    </div>

    <div class="charts-2col">
      <div>
        <div class="section-title">Abwesenheitsgründe</div>
        <div class="card chart-card"><canvas id="reasonChart"></canvas></div>
      </div>
      <div>
        <div class="section-title">Spielerranking</div>
        <div class="card ranking-card" id="ranking-inline"></div>
      </div>
    </div>
  `;
  document.getElementById('ranking-inline').innerHTML=[...playerStats].sort((a,b)=>b.pct-a.pct).map(function(x,i){
    var col=x.pct>=80?'var(--y)':x.pct>=60?'#f97316':'var(--r)';
    return '<div class="player-row" style="padding:8px 0">'+
      '<div class="rank-num">'+(i+1)+'</div>'+
      '<div class="avatar" style="width:30px;height:30px;font-size:11px">'+initials(x.p.name)+'</div>'+
      '<div class="pinfo"><div class="pname" style="font-size:12px">'+x.p.name+'</div>'+
      '<div class="pmeta">'+x.pr+'/'+totalSessions+(x.late?' · ⌛'+x.late:'')+'</div></div>'+
      '<div style="text-align:right;flex-shrink:0">'+
        '<div style="font-size:15px;font-weight:800;color:'+col+'">'+x.pct+'%</div>'+
        '<div class="pbar-wrap"><div style="width:'+x.pct+'%;height:3px;background:'+col+';border-radius:2px"></div></div>'+
      '</div></div>';
  }).join('');

  // Draw charts
  setTimeout(()=>{
    // Time chart
    const isMobile=window.innerWidth<768;
    const ctx1=document.getElementById('timeChart')?.getContext('2d');
    if(ctx1){
      ctx1.canvas.style.height=isMobile?'45vw':'200px';
      new Chart(ctx1,{
        type:'line',
        data:{
          labels:timeLabels,
          datasets:[{
            label:'Anwesenheit %',
            data:timeData,
            borderColor:'#f5c518',
            backgroundColor:'rgba(245,197,24,0.12)',
            tension:0.3,fill:true,
            pointBackgroundColor:last12.map(t=>isGame(t)?'#e05555':'#f5c518'),
            pointRadius:5,pointHoverRadius:7
          }]
        },
        options:{
          responsive:true,plugins:{legend:{display:false}},
          scales:{
            y:{min:0,max:100,ticks:{color:'#888',callback:v=>v+'%'},grid:{color:'rgba(255,255,255,0.06)'}},
            x:{ticks:{color:'#888',font:{size:9}},grid:{display:false}}
          }
        }
      });
    }

    // Player chart
    const ctx2=document.getElementById('playerChart')?.getContext('2d');
    if(ctx2){

window.submitInvite=async function(){
  const data=window._inviteData;

  const firstname=document.getElementById('inv-firstname').value.trim();
  const lastname=document.getElementById('inv-lastname').value.trim();
  const username=document.getElementById('inv-username').value.trim();
  const password=document.getElementById('inv-password').value;
  const password2=document.getElementById('inv-password2').value;

  errEl.style.display='none';

  if(!firstname||!lastname||!username){errEl.textContent='Bitte alle Felder ausfüllen.';errEl.style.display='block';return;}

  if(!/[A-Z]/.test(password)){errEl.textContent='Passwort braucht mindestens einen Großbuchstaben.';errEl.style.display='block';return;}
  if(!/[!@#$%&*_\-]/.test(password)){errEl.textContent='Passwort braucht mindestens ein Sonderzeichen (!@#$%&*_-).';errEl.style.display='block';return;}

window.processCSV=async function(){
  const text=document.getElementById('csv-input').value.trim();
  const ctx=S.formCtx;
  if(!text) return;
  const lines=text.split('\n').filter(l=>l.trim());
  showLoading('Importieren…');
  let count=0;
  for(const line of lines){
    const parts=line.split(',').map(s=>s.trim());
    if(ctx.csvType==='players'){
      const [name,trikot,birthdate,height,weight,growthStatus,notes]=parts;
      if(!name) continue;
      const data={name,trikot:trikot||'',birthdate:birthdate||'',height:parseInt(height)||0,weight:parseInt(weight)||0,growthStatus:parseInt(growthStatus)||50,notes:notes||'',teamId:ctx.csvTeamId};
      const nid=await fbAdd('players',data); S.players.push({id:nid,...data}); count++;
    } else {
      const [name,username,password,...teamNames]=parts;
      if(!name||!username) continue;
      const teamIds=teamNames.map(tn=>S.teams.find(t=>t.name===tn.trim())?.id).filter(Boolean);
      const data={name,username,password:password||'pass123',role:'trainer',teamIds};
      const nid=await fbAdd('coaches',data); S.coaches.push({id:nid,...data}); count++;
    }
  }
  hideLoading(); closeModal('csv-modal');
  showToast(count+' Einträge importiert ✓');
  if(ctx.csvType==='players') renderAdminPlayers(ctx.csvTeamId);
  else renderAdminView('coaches');
};

window.saveForm=async function(){
  const ctx=S.formCtx;
  showLoading('Speichern…');
  try{
    if(ctx.type==='team'){
      const name=document.getElementById('f-name').value.trim();
      const color=document.getElementById('f-color').value;
      if(!name){hideLoading();return;}
      if(ctx.id){await fbUpdate('teams',ctx.id,{name,color});const t=S.teams.find(t=>t.id===ctx.id);if(t){t.name=name;t.color=color;}}
      else{const nid=await fbAdd('teams',{name,color});S.teams.push({id:nid,name,color});}
      closeModal('form-modal'); renderAdminView('teams');
    } else if(ctx.type==='training'){
      const teamId=document.getElementById('f-team').value;
      const type=document.getElementById('f-type').value.trim();
      const date=document.getElementById('f-date').value;
      const meetTime=document.getElementById('f-meet')?.value||'';
      const startTime=document.getElementById('f-start')?.value||'';
      const endTime=document.getElementById('f-end')?.value||'';
      const location=document.getElementById('f-location').value.trim();
      const recurBtn=document.querySelector('.recur-toggle-btn.active');
      const isRecur=recurBtn&&recurBtn.dataset.r==='repeat';
      if(!teamId||!type){hideLoading();return;}
      // Handle recurring
      if(!ctx.id&&isRecur){
        const recurStart=document.getElementById('f-recur-start')?.value||getTodayStr();
        const recurEnd=document.getElementById('f-recur-end')?.value||'';
        const freq=document.getElementById('f-recur-freq')?.value||'weekly';
        if(!recurEnd){hideLoading();showToast('Bitte Enddatum wählen','err');return;}
        let dates=[];
        if(freq==='custom'){
          const customDays=parseInt(document.getElementById('f-custom-days')?.value)||7;
          const activeDays=Array.from(document.querySelectorAll('.weekday-btn.active')).map(b=>parseInt(b.dataset.d));
          dates=generateCustomDates(recurStart,recurEnd,customDays,activeDays);
        } else {
          dates=generateRecurDates(recurStart,recurEnd,freq);
        }
        if(!dates.length){hideLoading();showToast('Keine Termine im gewählten Zeitraum','err');return;}
        const recurGroup='rg_'+Date.now();
        for(const d of dates){
          const data={teamId,type,date:d,meetTime,startTime,endTime,location,recurring:freq,recurGroup};
          const nid=await fbAdd('trainings',data);S.trainings.push({id:nid,...data});
        }
        closeModal('form-modal');renderAdminView('trainings');renderDashboard();
        showToast(dates.length+' Termine angelegt ✓');
        hideLoading();return;
      }
      if(!date){hideLoading();return;}
      const data={teamId,type,date,meetTime,startTime,endTime,location,recurring:'none'};
      if(ctx.id){await fbUpdate('trainings',ctx.id,data);const t=S.trainings.find(t=>t.id===ctx.id);if(t)Object.assign(t,data);}
      else{const nid=await fbAdd('trainings',data);S.trainings.push({id:nid,...data});}
      closeModal('form-modal'); renderAdminView('trainings'); renderDashboard();
    } else if(ctx.type==='recurring'){
      const teamId=document.getElementById('f-team').value;
      const type=document.getElementById('f-type').value.trim();
      const startDate=document.getElementById('f-start-date').value;
      const endDate=document.getElementById('f-end-date').value;
      const recurType=document.getElementById('f-recur').value;
      const dayOfWeek=parseInt(document.getElementById('f-dow').value);
      const meetTime=document.getElementById('f-meet')?.value||'';
      const startTime=document.getElementById('f-start')?.value||'';
      const endTime=document.getElementById('f-end')?.value||'';
      const location=document.getElementById('f-location').value.trim();
      if(!teamId||!type||!startDate||!endDate){hideLoading();return;}
      // Generate dates
      let cur=new Date(startDate+'T12:00:00');
      const end=new Date(endDate+'T12:00:00');
      const step=recurType==='weekly'?7:recurType==='biweekly'?14:28;
      // Find first occurrence
      while(cur.getDay()!==dayOfWeek) cur.setDate(cur.getDate()+1);
      let count2=0;
      while(cur<=end){
        const d=cur.toISOString().slice(0,10);
        const data={teamId,type,date:d,meetTime,startTime,endTime,location,recurring:recurType};
        const nid=await fbAdd('trainings',data); S.trainings.push({id:nid,...data}); count2++;
        cur.setDate(cur.getDate()+step);
      }
      closeModal('form-modal'); renderAdminView('trainings'); renderDashboard();
      showToast(count2+' Trainings erstellt ✓');
    } else if(ctx.type==='coach'){
      const name=document.getElementById('f-name').value.trim();
      const username=document.getElementById('f-username').value.trim();
      const password=document.getElementById('f-password').value.trim();
      const role=document.getElementById('f-role').value;
      const teamIds=Array.from(document.querySelectorAll('.tcb:checked')).map(c=>c.value);
      if(!name||!username){hideLoading();return;}
      if(ctx.id){const upd={name,username,role,teamIds};if(password)upd.password=password;await fbUpdate('coaches',ctx.id,upd);const c=S.coaches.find(c=>c.id===ctx.id);if(c)Object.assign(c,upd);}
      else{if(!password){hideLoading();return;}const data={name,username,password,role,teamIds};const nid=await fbAdd('coaches',data);S.coaches.push({id:nid,...data});}
      closeModal('form-modal'); renderAdminView('coaches');
    } else if(ctx.type==='player'){
      const name=document.getElementById('f-name').value.trim();
      const birthdate=document.getElementById('f-birth').value;
      const trikot=document.getElementById('f-trikot').value.trim();
      const height=parseInt(document.getElementById('f-height').value)||0;
      const weight=parseInt(document.getElementById('f-weight').value)||0;
      const growthStatus=parseInt(document.getElementById('f-growth').value)||0;
      const notes=document.getElementById('f-notes').value.trim();
      if(!name){hideLoading();return;}
      const data={name,birthdate,trikot,height,weight,growthStatus,notes};
      if(ctx.id){await fbUpdate('players',ctx.id,data);const p=S.players.find(p=>p.id===ctx.id);if(p)Object.assign(p,data);}
      else{const fd={...data,teamId:ctx.teamId};const nid=await fbAdd('players',fd);S.players.push({id:nid,...fd});}
      closeModal('form-modal');
      const tid=document.getElementById('admin-player-team-filter')?.value||ctx.teamId;
      if(tid) renderAdminPlayers(tid); renderPlayersList();
    }
    showToast('Gespeichert ✓');
  }catch(e){showToast('Fehler: '+e.message,'err');}
  hideLoading();
};

window.generateSecurePassword=function(){
  const upper='ABCDEFGHJKLMNPQRSTUVWXYZ';
  const lower='abcdefghjkmnpqrstuvwxyz';
  const digits='23456789';
  const special='!@#$%&*';
  let pw='';
  // At least 1 uppercase, 1 special, rest digits → 8 chars total
  pw+=upper[Math.floor(Math.random()*upper.length)];
  pw+=special[Math.floor(Math.random()*special.length)];
  pw+=lower[Math.floor(Math.random()*lower.length)];
  for(let i=0;i<5;i++) pw+=digits[Math.floor(Math.random()*digits.length)];
  // Shuffle
  return pw.split('').sort(()=>Math.random()-0.5).join('');
};

window._activeTimePicker = null;
window.openTimePicker = function(fieldId, label) {
  // Close any open picker first
  const existing = document.getElementById('__time-picker-dropdown');
  if(existing) existing.remove();
  const current = document.getElementById(fieldId).value || '00:00';
  const [h,m] = current.split(':').map(Number);
  window._activeTimePicker = {fieldId, h: h||0, m: m||0};
  const dp = document.createElement('div');
  dp.id = '__time-picker-dropdown';
  dp.className = 'time-picker-dropdown';
  dp.innerHTML = `
    <h4>${label}</h4>
    <div class="time-cols">
      <div class="time-col">
        <div class="time-col-label">Stunde</div>
        <button class="time-step-btn" onclick="stepTime('h',1)">▲</button>
        <div class="time-val-display" id="tp-h" onclick="editTimeVal('h')">${String(window._activeTimePicker.h).padStart(2,'0')}</div>
        <button class="time-step-btn" onclick="stepTime('h',-1)">▼</button>
      </div>
      <div class="time-colon">:</div>
      <div class="time-col">
        <div class="time-col-label">Minute</div>
        <button class="time-step-btn" onclick="stepTime('m',15)">▲</button>
        <div class="time-val-display" id="tp-m" onclick="editTimeVal('m')">${String(window._activeTimePicker.m).padStart(2,'0')}</div>
        <button class="time-step-btn" onclick="stepTime('m',-15)">▼</button>
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px">Auf Zahl tippen für genaue Eingabe</div>
    <div class="time-picker-actions">
      <button style="background:var(--card2);color:var(--muted)" onclick="closeTimePicker()">Abbrechen</button>
      <button style="background:var(--y);color:#000" onclick="confirmTimePicker()">Bestätigen</button>
    </div>`;
  document.body.appendChild(dp);
  // Close on outside click
  setTimeout(()=>document.addEventListener('click', function handler(e){
    if(!dp.contains(e.target)){dp.remove();document.removeEventListener('click',handler);}
  }), 100);
};
window.stepTime = function(part, delta) {
  const tp = window._activeTimePicker;
  if(!tp) return;
  if(part==='h') { tp.h = ((tp.h + delta) + 24) % 24; }
  else { tp.m = ((tp.m + delta) + 60) % 60; }
  document.getElementById('tp-h').textContent = String(tp.h).padStart(2,'0');
  document.getElementById('tp-m').textContent = String(tp.m).padStart(2,'0');
};
window.editTimeVal = function(part) {
  const el = document.getElementById('tp-'+part);
  const inp = document.createElement('input');
  inp.type = 'number';
  inp.className = 'time-val-input';
  inp.value = el.textContent;
  inp.min = 0; inp.max = part==='h'?23:59;
  inp.oninput = ()=>{
    const v = parseInt(inp.value)||0;
    if(part==='h') window._activeTimePicker.h=Math.min(23,Math.max(0,v));
    else window._activeTimePicker.m=Math.min(59,Math.max(0,v));
  };
  inp.onblur = ()=>{
    el.textContent = String(part==='h'?window._activeTimePicker.h:window._activeTimePicker.m).padStart(2,'0');
    inp.replaceWith(el);
  };
  el.replaceWith(inp);
  inp.focus(); inp.select();
};
window.confirmTimePicker = function() {
  const tp = window._activeTimePicker;
  if(!tp) return;
  const val = String(tp.h).padStart(2,'0')+':'+String(tp.m).padStart(2,'0');
  document.getElementById(tp.fieldId).value = val;
  // Update display button
  const btn = document.getElementById(tp.fieldId+'-btn');
  if(btn) btn.textContent = val;
  document.getElementById('__time-picker-dropdown')?.remove();
};
window.closeTimePicker = function() {
  document.getElementById('__time-picker-dropdown')?.remove();
};

window.generateCustomDates=function(startStr,endStr,intervalDays,weekdayFilter){
  const dates=[];
  const end=new Date(endStr+'T12:00:00');
  let cur=new Date(startStr+'T12:00:00');
  // If weekday filter active, generate day by day checking
  if(weekdayFilter&&weekdayFilter.length>0){
    while(cur<=end){
      const dow=cur.getDay()||7; // 1=Mon...7=Sun
      if(weekdayFilter.includes(dow)) dates.push(cur.toISOString().slice(0,10));
      cur.setDate(cur.getDate()+1);
      if(dates.length>500) break;
    }
  } else {
    while(cur<=end){
      dates.push(cur.toISOString().slice(0,10));
      cur.setDate(cur.getDate()+intervalDays);
      if(dates.length>500) break;
    }
  }
  return dates;
};
window.generateRecurDates=function(startStr,endStr,freq){
  const dates=[];
  const end=new Date(endStr+'T12:00:00');
  let cur=new Date(startStr+'T12:00:00');
  while(cur<=end){
    dates.push(cur.toISOString().slice(0,10));
    if(freq==='weekly') cur.setDate(cur.getDate()+7);
    else if(freq==='biweekly') cur.setDate(cur.getDate()+14);
    else if(freq==='monthly') cur.setMonth(cur.getMonth()+1);
    else if(freq==='yearly') cur.setFullYear(cur.getFullYear()+1);
    else break;
    if(dates.length>200) break; // safety limit
  }
  return dates;
};

window.deletePlayer=async function(id){
  const p=S.players.find(x=>x.id===id);
  if(!p){showToast('Spieler nicht gefunden','err');return;}
  if(!confirm('Spieler "'+p.name+'" löschen?')) return;
  if(!confirm('⚠️ ENDGÜLTIG löschen? Kann nicht rückgängig gemacht werden!')) return;
  showLoading('Spieler wird gelöscht…');
  try{
    // Delete from Firebase
    await fbDb.collection('players').doc(id).delete();
    // Delete attendance records
    const attSnap=await fbDb.collection('attendance').where('playerId','==',id).get();
    const batch=fbDb.batch();
    attSnap.docs.forEach(d=>batch.delete(d.ref));
    if(attSnap.docs.length>0) await batch.commit();
    // Update local state
    S.players=S.players.filter(pl=>pl.id!==id);
    S.attendance=S.attendance.filter(a=>a.playerId!==id);
    hideLoading();
    closeModal('player-modal');
    // Refresh all views
    const tid=document.getElementById('admin-player-team-filter')?.value||p.teamId||S.teams[0]?.id;
    if(tid) renderAdminPlayers(tid);
    renderPlayersList();
    renderDashboard();
    showToast(p.name+' wurde gelöscht ✓');
  }catch(err){
    hideLoading();
    showToast('Fehler: '+err.message,'err');
    console.error('deletePlayer error:',err);
  }
};

function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('login-user').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

checkInvite();
</script>

<style>
:root{
  --bg:#0a0a0a; --card:#141414; --card2:#1e1e1e; --border:#2a2a2a;
  --text:#f0f0f0; --muted:#666; --y:#f5c518; --r:#e05555; --g:#22c55e;
  --radius:14px; --shadow:0 2px 16px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
h1,h2,h3,.logo{font-family:'Barlow Condensed',sans-serif;}

/* AUTH */
#auth-screen{min-height:100vh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.auth-logo-img{width:300px;max-width:85vw;height:auto;object-fit:contain;margin-bottom:32px;}
.auth-card{background:#111;border:1px solid #222;border-radius:20px;padding:28px 24px;width:100%;max-width:380px;}
.auth-card h2{color:var(--y);font-size:22px;margin-bottom:22px;letter-spacing:1px;text-transform:uppercase;}
.field{margin-bottom:14px;}
.field label{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:5px;}
.field input{width:100%;padding:12px 14px;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color 0.2s;-webkit-appearance:none;}
.field input:focus{border-color:var(--y);}
.btn-primary{width:100%;padding:14px;background:var(--y);border:none;border-radius:10px;color:#000;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;margin-top:6px;}
.btn-primary:active{opacity:0.85;}
.auth-error{color:var(--r);font-size:13px;margin-top:8px;text-align:center;display:none;}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh;}
.app-header{background:#000;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid #1a1a1a;gap:8px;min-width:0;}
.hdr-logo{height:24px;max-width:100px;width:auto;object-fit:contain;object-position:left center;display:block;}
.hdr-right{display:flex;align-items:center;gap:8px;}
#hdr-role{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.btn-icon{background:#1a1a1a;border:none;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
.bottom-nav{
  background:#000;
  display:flex;
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:100;
  padding:6px env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
  border-top:1px solid #1a1a1a;
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;padding:6px 4px;color:var(--muted);font-size:9px;font-family:'DM Sans',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;transition:color 0.15s;min-width:0;}
.nav-item svg{width:20px;height:20px;}
.nav-item.active{color:var(--y);}
.content{flex:1;padding:14px 14px 88px;}
.view{display:none;} .view.active{display:block;}
.card{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--border);margin-bottom:10px;}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px;}

/* TRAINING CARDS */
.bday-section{margin-bottom:16px}
.bday-list{display:flex;flex-direction:column;gap:8px}
.bday-item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--border);border-left:3px solid var(--y)}
.bday-cake{font-size:22px;flex-shrink:0}
.bday-info{flex:1;min-width:0}
.bday-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.bday-age{font-size:11px;color:var(--muted);font-weight:400}
.bday-meta{font-size:12px;color:var(--muted);margin-top:2px}
.dash-section-header{display:flex;align-items:center;gap:8px;margin:12px 0 10px;padding:0 2px}
.dash-section-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.today-dot{background:var(--y)}
.later-dot{background:#555}
.dash-section-label{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;white-space:nowrap}
.dash-section-line{flex:1;height:1px;background:var(--border)}
.training-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;overflow:hidden;cursor:pointer;transition:transform 0.12s,border-color 0.12s;}
.training-card:active{transform:scale(0.98);}
.training-card:hover{border-color:#333;}
.tc-header{background:#111;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.tc-left{display:flex;align-items:center;gap:10px;}
.tc-icon{font-size:18px;}
.tc-type{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--text);letter-spacing:0.5px;}
.tc-team{font-size:11px;color:var(--muted);}
.tc-badge{background:#1e1e1e;color:var(--muted);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;border:1px solid #2a2a2a;}
.tc-badge.today{background:var(--y);color:#000;border-color:var(--y);}
.tc-body{padding:10px 14px;}
.tc-times{display:flex;gap:14px;margin-bottom:10px;}
.tc-time{text-align:center;}
.tc-time span{font-size:15px;font-weight:700;color:var(--text);display:block;}
.tc-time label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;}
.tc-stats{display:flex;}
.tc-stat{flex:1;text-align:center;padding:6px;border-right:1px solid var(--border);font-size:13px;font-weight:700;}
.tc-stat:last-child{border-right:none;}
.tc-stat.y{color:var(--y);} .tc-stat.r{color:var(--r);} .tc-stat.g{color:var(--muted);}

/* CHIPS */
.chip-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card2);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.12s;color:var(--muted);font-family:'DM Sans',sans-serif;}
.chip.active{background:var(--y);color:#000;border-color:var(--y);}

/* PLAYERS */
.player-row{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.player-row:last-child{border-bottom:none;}
.avatar{width:36px;height:36px;border-radius:50%;background:#1a1a1a;border:1.5px solid #333;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:var(--y);flex-shrink:0;margin-right:11px;}
.pinfo{flex:1;min-width:0;}
.pname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pmeta{font-size:11px;color:var(--muted);margin-top:1px;}
.pnote{font-size:11px;color:#f97316;margin-top:2px;}
.pnote.warn{color:var(--y);}
.att-btns{display:flex;gap:5px;flex-shrink:0;}
.att-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:700;transition:all 0.12s;color:var(--muted);}
.att-btn.ap{background:var(--y);border-color:var(--y);color:#000;}
.att-btn.al{background:#3b82f6;border-color:#3b82f6;color:#fff;}
.att-btn.al-excused{background:#22c55e;border-color:#22c55e;color:#fff;}
.att-btn.aa{background:var(--r);border-color:var(--r);color:#fff;}
.att-btn.aa-excused{background:#f97316;border-color:#f97316;color:#fff;}
.att-btn.ae{background:#22c55e;border-color:#22c55e;color:#fff;}
.att-btn.au{background:#6b21a8;border-color:#6b21a8;color:#fff;}
.excused-badge{display:inline-block;background:rgba(34,197,94,0.15);color:#22c55e;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:4px}
.unexcused-badge{display:inline-block;background:rgba(224,85,85,0.15);color:var(--r);border-radius:6px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:4px}
.excused-wrap{background:rgba(255,255,255,0.04);border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.08)}
.excused-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.excused-opts{display:flex;flex-direction:column;gap:6px}
.excused-opt{padding:9px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;background:var(--card2);color:var(--text)}
.excused-opt.sel-exc{background:#1e3a2f;color:#22c55e;border-color:#22c55e}
.excused-opt[data-exc="no"].sel-exc{background:#2a1515;color:var(--r);border-color:var(--r)}
.excused-opt[data-exc="null"].sel-exc{background:var(--card2);color:var(--muted);border-color:var(--border)}

/* SUMMARY BAR */
.summary-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:12px;}
.sb-item{background:var(--card);border-radius:8px;padding:8px 4px;text-align:center;border:1px solid var(--border);min-width:0;}
.sb-item span{display:block;font-size:18px;font-weight:800;line-height:1.2;}
.sb-item label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;line-height:1.3;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-item.y span{color:var(--y);} .sb-item.r span{color:var(--r);} .sb-item.g span{color:var(--muted);}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--border);width:100%;padding:18px calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));transform:translateY(100%);transition:transform 0.28s cubic-bezier(0.34,1.4,0.64,1);max-height:92vh;overflow-y:auto;}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:#333;border-radius:2px;margin:0 auto 14px;}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;margin-bottom:14px;color:var(--y);letter-spacing:0.5px;text-transform:uppercase;}
.rchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.rchip{padding:8px 13px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.12s;background:var(--card2);color:var(--muted);}
.rchip.sel{background:var(--y);color:#000;border-color:var(--y);}
.modal-note{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;resize:none;outline:none;height:68px;margin-bottom:12px;background:var(--card2);color:var(--text);}
.modal-note:focus{border-color:var(--y);}
.modal-btns{display:flex;gap:8px;}
.btn-cancel{flex:1;padding:12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;cursor:pointer;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
.btn-save{flex:2;padding:12px;background:var(--y);border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;cursor:pointer;color:#000;text-transform:uppercase;letter-spacing:0.5px;}

/* FORM FIELDS */
.form-field{margin-bottom:12px;}
.form-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px;}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--card2);outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--y);}

/* PLAYER DETAIL */
.pdtl-hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.pdtl-av{width:54px;height:54px;border-radius:50%;background:#1a1a1a;border:2px solid var(--y);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;color:var(--y);}
.pdtl-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:0.5px;}
.pdtl-team{font-size:12px;color:var(--muted);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.info-box{background:var(--card2);border-radius:10px;padding:11px;border:1px solid var(--border);}
.ib-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
.ib-val{font-size:16px;font-weight:700;margin-top:2px;}
.growth-wrap{margin-bottom:14px;}
.growth-lbl{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.growth-bar{height:7px;background:#1e1e1e;border-radius:4px;overflow:hidden;}
.warn-box{background:#1a1200;border:1px solid #3a2800;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--y);}
.history-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:9px;}
.history-row:last-child{border-bottom:none;}
.hdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.hdot.pr{background:var(--y);} .hdot.ab{background:var(--r);} .hdot.uk{background:var(--border);}

/* ANALYTICS */
.stats-row{display:flex;gap:8px;margin-bottom:4px;}
.stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.sb-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:var(--text);}
.sb-val.y{color:var(--y);}
.sb-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px;}
.rank-num{width:22px;font-size:12px;font-weight:800;color:var(--muted);flex-shrink:0;text-align:center;}
.pbar-wrap{width:60px;height:4px;background:#1e1e1e;border-radius:2px;margin-top:4px;overflow:hidden;}

/* ADMIN */
.admin-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.admin-row:last-child{border-bottom:none;}
.arow-left{flex:1;min-width:0;}
.arow-name{font-weight:600;font-size:14px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
.arow-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.btn-sm{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-sm.edit{background:#1e1e1e;color:var(--text);}
.btn-sm.del{background:rgba(224,85,85,0.15);color:var(--r);}

/* BADGES */
.badge-y{background:rgba(245,197,24,0.15);color:var(--y);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;display:inline-block;}
.badge-r{background:rgba(224,85,85,0.15);color:var(--r);padding:2px 6px;border-radius:8px;font-size:10px;font-weight:700;display:inline-block;}

/* SEARCH */
.search-bar{display:flex;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:0 12px;margin-bottom:12px;}
.search-bar input{flex:1;border:none;outline:none;padding:10px 9px;font-family:'DM Sans',sans-serif;font-size:14px;background:transparent;color:var(--text);}
.search-bar span{color:var(--muted);}

/* LOADING */
#loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.spin{width:36px;height:36px;border:3px solid #333;border-top-color:var(--y);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading-msg{color:var(--text);font-size:13px;font-weight:600;}

/* TOAST */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:#1a1a1a;border:1px solid #333;color:var(--text);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;z-index:400;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:#2a0000;border-color:var(--r);color:var(--r);}

/* EMPTY STATE */
.empty-state{text-align:center;padding:36px 20px;color:var(--muted);}
.empty-state .icon{font-size:44px;margin-bottom:10px;display:block;}

/* ATT DETAIL OVERLAY */
#att-detail-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:150;overflow-y:auto;}
.att-dtl-hdr{background:var(--hbg);padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2;justify-content:space-between;}
.back-btn{background:#1a1a1a;border:none;border-radius:8px;width:34px;height:34px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.att-dtl-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;color:var(--y);}
.att-dtl-sub{color:var(--muted);font-size:11px;}

/* INVITE OVERLAY */
#invite-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:600;display:none;align-items:center;justify-content:center;padding:24px;}
.invite-card{background:#111;border:1px solid #333;border-radius:20px;padding:28px 24px;width:100%;max-width:380px;}
.invite-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--y);text-transform:uppercase;margin-bottom:6px;}
.invite-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}

/* CSV MODAL */
.csv-hint{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6;}
.csv-textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-family:monospace;font-size:12px;resize:vertical;outline:none;height:140px;background:#0a0a0a;color:var(--text);margin-bottom:12px;}
.csv-textarea:focus{border-color:var(--y);}

/* ── GAME CARD COLOR ── */
.tc-badge.game{background:#e05555!important;}
.tc-header.game-hdr{background:#2a1515!important;}

/* ── MINUTES INPUT ── */
.mins-row{padding:4px 0 8px 50px}
.mins-input{width:72px;padding:5px 8px;background:rgba(255,255,255,0.07);border:1px solid rgba(245,197,24,0.3);border-radius:8px;color:var(--y);font-size:13px;font-weight:700;text-align:center;outline:none}
.mins-input::placeholder{color:#555}
.mins-badge{display:inline-block;background:rgba(245,197,24,0.15);color:var(--y);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:4px}

/* ── CHART LAYOUT ── */
.chart-screen{margin-bottom:0}
.chart-card{padding:12px!important;margin-bottom:8px;height:auto!important}
.chart-card canvas{width:100%!important;display:block;height:auto!important}

/* Mobile: each chart adapts to content */
@media(max-width:767px){
  .chart-screen{margin-bottom:16px}
  .chart-card{padding:12px!important}
  .charts-2col{display:flex;flex-direction:column;gap:0}
  .charts-2col>div{margin-bottom:16px}
  .ranking-card{overflow-y:auto}
}

/* iPad: side by side for reason+ranking */
@media(min-width:768px){
  .charts-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .chart-screen{margin-bottom:12px}
  .ranking-card{overflow-y:auto}
}


/* ── LONG STATUS ── */
.phv-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(239,68,68,0.2);color:#f87171;margin-top:3px;border:1px solid rgba(239,68,68,0.3)}
.phv-detail-box{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#f87171;line-height:1.5}
.data-note-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:11px;color:#666;font-style:italic}
.ls-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(224,85,85,0.2);color:#ff8080;margin-top:3px}
.ls-badge.ls-perm{background:rgba(249,115,22,0.2);color:#fb923c;border:1px solid rgba(249,115,22,0.3)}
.ls-toggle-wrap{background:rgba(255,255,255,0.04);border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.08)}
.ls-toggle-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.ls-options{display:flex;flex-wrap:wrap;gap:6px}
.ls-opt{padding:7px 12px;border-radius:20px;border:1.5px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--text)}
.ls-opt.sel-ls{background:#e05555;color:white;border-color:#e05555}
.ls-opt2{padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;font-weight:500;cursor:pointer;background:var(--card2);color:var(--text)}
.ls-opt2.active{background:#e05555;color:white;border-color:#e05555}
.ls-opt2[data-v="none"].active{background:var(--y);color:#000;border-color:var(--y)}
.ls-current-badge{display:inline-block;padding:8px 14px;border-radius:10px;background:rgba(224,85,85,0.15);color:#ff8080;font-size:14px;font-weight:700;border:1px solid rgba(224,85,85,0.3)}
.ls-active-card{background:rgba(224,85,85,0.1);border:1px solid rgba(224,85,85,0.3);border-radius:12px;padding:12px;margin-bottom:12px}
.ls-active-label{font-size:16px;font-weight:800;color:#ff8080}
.ls-active-since{font-size:12px;color:var(--muted);margin-top:2px}
.ls-active-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px}
.ls-edit-btn{margin-top:10px;padding:7px 14px;border-radius:8px;border:1px solid rgba(224,85,85,0.4);background:transparent;color:#ff8080;font-size:13px;font-weight:700;cursor:pointer}
.ls-set-btn{width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:12px}
.ls-dec-opt{padding:9px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--text)}
.ls-dec-opt.active{background:#3b82f6;color:white;border-color:#3b82f6}
.recur-toggle-btn{padding:9px 16px;border-radius:10px;border:1.5px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--text);flex:1;text-align:center}
.recur-toggle-btn.active{background:var(--y);color:#000;border-color:var(--y)}
/* ── CUSTOM TIME PICKER ── */
.time-picker-wrap{position:relative;display:flex;gap:8px;align-items:center}
.time-picker-display{flex:1;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--card2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif}
.time-picker-display:hover{border-color:var(--y)}
.time-picker-dropdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1.5px solid var(--border);border-radius:16px;z-index:999;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,0.4);width:280px}
.time-picker-dropdown h4{text-align:center;font-size:14px;color:var(--muted);margin-bottom:12px;font-family:'Syne',sans-serif}
.time-cols{display:flex;gap:8px;justify-content:center;align-items:flex-start}
.time-col{display:flex;flex-direction:column;gap:4px;align-items:center}
.time-col-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.time-step-btn{width:44px;height:36px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.time-step-btn:active{background:var(--y);color:#000}
.time-val-display{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--y);background:rgba(245,197,24,0.1);color:var(--y);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Syne',sans-serif}
.time-val-display.editing{border-color:#3b82f6;background:rgba(59,130,246,0.1);color:#3b82f6}
.time-val-input{width:44px;height:44px;border-radius:10px;border:1.5px solid #3b82f6;background:rgba(59,130,246,0.1);color:#3b82f6;font-size:20px;font-weight:800;text-align:center;outline:none;font-family:'Syne',sans-serif;-webkit-appearance:none}
.time-colon{font-size:24px;font-weight:800;color:var(--y);margin-top:44px}
.time-picker-actions{display:flex;gap:8px;margin-top:12px}
.time-picker-actions button{flex:1;padding:10px;border-radius:10px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:13px}

.type-btn{padding:10px 8px;border-radius:10px;border:1.5px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--text);text-align:center}
.type-btn.active{background:var(--y);color:#000;border-color:var(--y)}
.weekday-btn{padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;background:var(--card2);color:var(--text);min-width:38px;text-align:center}
.weekday-btn.active{background:#3b82f6;color:white;border-color:#3b82f6}
.ls-section{margin-bottom:16px}

</style>
</head>

    <div class="csv-hint" id="csv-format-hint"></div>
    <textarea class="csv-textarea" id="csv-input" placeholder="CSV Daten hier einfügen…"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCsvModal()">Abbrechen</button>
      <button class="btn-save" onclick="processCSV()">Importieren</button>
    </div>
  </div>
</div>


<!-- LONG STATUS MODAL -->
<div class="modal-overlay" id="ls-modal">
  <div class="modal-sheet" style="max-height:92vh;overflow-y:auto">
    <div class="modal-handle"></div>
    <div style="margin-bottom:16px">
      <div class="modal-title" style="margin-bottom:2px" id="ls-modal-name">Spieler</div>
      <div style="font-size:12px;color:var(--muted)" id="ls-modal-since"></div>
    </div>
    <div id="ls-current" style="margin-bottom:14px"></div>
    <div class="section-title" style="margin-top:0">Status wählen</div>
    <div id="ls-opts" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px"></div>
    <div class="form-field">
      <label>Enddatum (geplante Rückkehr)</label>
      <input type="date" id="ls-end-date">
    </div>
    <div class="form-field">
      <label>Entscheidung durch</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="ls-decision-opts">
        <div class="ls-dec-opt" data-d="coach" onclick="selDecision(this)">👨‍💼 Coach</div>
        <div class="ls-dec-opt" data-d="doctor" onclick="selDecision(this)">👨‍⚕️ Arzt</div>
        <div class="ls-dec-opt" data-d="physio" onclick="selDecision(this)">💪 Physio</div>
      </div>
    </div>
    <div class="form-field">
      <label>Notiz (optional)</label>
      <input type="text" id="ls-note-input" placeholder="z.B. Knie-OP, Details…">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('ls-modal')">Abbrechen</button>
      <button class="btn-save" onclick="saveLongStatus()">Speichern</button>
    </div>
  </div>
</div>

</body>
</html>
