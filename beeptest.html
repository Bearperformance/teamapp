<html lang="de">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>20m Shuttle Beep Run Test — Bear Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    firebase.initializeApp({

<style>
  :root{
    --black:#000;
    --white:#fff;
    --grey:#f2f2f2;
    --line:#e0e0e0;
    --muted:#777;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--white);
    color:var(--black);
    font-size:16px;
    -webkit-text-size-adjust:100%;
    padding-bottom:84px;
  }
  /* ---- Header ---- */
  header{
    background:var(--black);
    color:var(--white);
    padding:12px 16px 14px;
    text-align:center;
  }
  header img{height:34px;width:auto;display:block;margin:0 auto 8px;}
  header .title{
    font-weight:800;
    font-size:18px;
    line-height:1.2;
    letter-spacing:.5px;
    text-transform:uppercase;
  }
  header .subtitle{
    font-weight:500;
    font-size:12px;
    color:#bbb;
    margin-top:4px;
    letter-spacing:1px;
  }
  header .ver{
    font-weight:700;
    color:var(--white);
    background:rgba(255,255,255,.16);
    border-radius:6px;
    padding:1px 6px;
    margin-left:6px;
    letter-spacing:.5px;
  }
  /* ---- Sections ---- */
  .wrap{max-width:680px;margin:0 auto;padding:16px;}
  .card{
    background:var(--white);
    border:2px solid var(--black);
    border-radius:14px;
    padding:13px;
    margin-bottom:12px;
  }
  .card h2{
    margin:0 0 10px;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1.2px;
  }
  label{
    display:block;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.8px;
    color:var(--muted);
    margin:0 0 4px;
  }
  input,textarea,select{
    font-family:inherit;
    font-size:16px;
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:var(--white);
    color:var(--black);
    outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--black);}
  textarea{resize:vertical;min-height:60px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field{margin-bottom:10px;}
  /* Einklappbarer Bedingungs-Block */
  .cond-toggle{
    width:100%;margin-top:10px;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--grey);border:1.5px solid var(--line);border-radius:9px;
    padding:10px 12px;
    font-family:inherit;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    cursor:pointer;
  }
  .cond-toggle .chev{font-size:13px;transition:transform .15s;}
  .cond-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .cond-body{margin-top:10px;}
  .field:last-child{margin-bottom:0;}

  /* ---- Athlete rows (kompakt, eine Zeile) ---- */
  #athletes{display:flex;flex-direction:column;gap:7px;}
  .athlete{
    display:flex;
    align-items:center;
    gap:6px;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:5px 7px;
    background:var(--grey);
  }
  .athlete .idx{
    min-width:20px;height:20px;
    background:var(--black);color:var(--white);
    border-radius:50%;
    font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .athlete .name{
    flex:1;min-width:0;
    background:var(--white);
    font-size:15px;
    padding:9px 9px;
  }
  .athlete .btn{
    width:44px;height:44px;flex-shrink:0;
    border:none;border-radius:9px;
    background:var(--black);color:var(--white);
    font-size:25px;font-weight:700;line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    user-select:none;
    transition:transform .05s;
  }
  .athlete .btn:active{transform:scale(.9);}
  .athlete .btn.minus{background:var(--white);color:var(--black);border:2px solid var(--black);}
  .athlete .val{
    min-width:52px;
    text-align:center;
    background:var(--white);
    border:2px solid var(--black);
    border-radius:9px;
    padding:9px 2px;
    font-size:21px;font-weight:800;line-height:1;
    flex-shrink:0;
  }
  /* Finish-Button (Test abschliessen) */
  .athlete .btn.finish{
    background:var(--white);color:var(--black);
    border:2px solid var(--black);
    font-size:19px;
  }
  .athlete .btn.finish.active{background:var(--black);color:var(--white);}
  .athlete .btn:disabled{opacity:.3;pointer-events:none;}
  /* Abgeschlossener Athlet */
  .athlete.finished{background:#e9e9e9;}
  .athlete.finished .val{background:var(--black);color:var(--white);}
  .athlete.finished .name{color:var(--muted);}
  /* Abgebrochener Athlet */
  .athlete.aborted{background:#e9e9e9;}
  .athlete.aborted .name{color:var(--muted);text-decoration:line-through;}
  .athlete.aborted .val{background:var(--white);color:var(--muted);border-style:dashed;}
  .athlete.aborted .btn.finish.active{background:var(--black);color:var(--white);}

  /* Swipe-nach-links: Abbruch + Löschen */
  .athlete-wrap{position:relative;overflow:hidden;border-radius:10px;}
  .athlete-wrap .athlete{position:relative;z-index:1;will-change:transform;touch-action:pan-y;}
  .swipe-actions{
    position:absolute;top:0;right:0;height:100%;width:176px;z-index:0;
    display:flex;
  }
  .swipe-actions button{
    flex:1;border:none;
    font-family:inherit;font-size:11px;font-weight:800;
    text-transform:uppercase;letter-spacing:.3px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#fff;line-height:1.1;text-align:center;
  }
  .swipe-abort{background:#555;}
  .swipe-abort:active{background:#777;}
  .swipe-del{background:#000;border-radius:0 10px 10px 0;}
  .swipe-del:active{background:#333;}

  /* ---- Add athlete ---- */
  .add-btn{
    width:100%;
    padding:13px;
    border:2px dashed var(--black);
    border-radius:12px;
    background:var(--white);
    color:var(--black);
    font-family:inherit;
    font-size:15px;font-weight:800;
    text-transform:uppercase;letter-spacing:1px;
    cursor:pointer;
    margin-top:10px;
  }
  .add-btn:active{background:var(--black);color:var(--white);}

  /* ---- Export bar ---- */
  .exportbar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--black);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;
    max-width:680px;margin:0 auto;
  }
  .exportbar .exportrow{display:flex;gap:10px;}
  .exportbar button{
    flex:1;
    padding:14px 8px;
    border:none;border-radius:10px;
    font-family:inherit;
    font-size:14px;font-weight:800;
    text-transform:uppercase;letter-spacing:.5px;
    cursor:pointer;
  }
  .exportbar .save{background:var(--black);color:var(--white);width:100%;border:2px solid var(--white);}
  .exportbar .pdf{background:var(--white);color:var(--black);}
  .exportbar .csv{background:var(--white);color:var(--black);}
  .exportbar .arch{background:var(--white);color:var(--black);}
  .exportbar button:active{opacity:.7;}
  .hint{font-size:11px;color:var(--muted);margin-top:7px;text-align:center;}

  /* ---- Log / gespeicherte Tests ---- */
  #log{display:flex;flex-direction:column;gap:8px;}
  .log-item{
    border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;background:var(--grey);
  }
  .log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .log-team{font-size:15px;font-weight:800;}
  .log-sync{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .log-meta{font-size:12px;color:#555;line-height:1.45;}

  /* ---- Modal (Doppel-Bestätigung) ---- */
  .modal-ov{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .modal-ov[hidden]{display:none;}
  .modal{
    background:var(--white);
    border:2px solid var(--black);
    border-radius:16px;
    padding:20px;
    width:100%;max-width:340px;
    text-align:center;
  }
  .modal-title{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
  .modal-msg{font-size:14px;color:#333;margin-bottom:18px;line-height:1.4;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{
    flex:1;padding:13px 8px;border-radius:10px;
    font-family:inherit;font-size:14px;font-weight:800;
    text-transform:uppercase;letter-spacing:.4px;cursor:pointer;
  }
  .m-cancel{background:var(--white);color:var(--black);border:2px solid var(--black);}
  .m-ok{background:var(--black);color:var(--white);border:2px solid var(--black);}
  .m-ok.armed{animation:pulse .6s infinite alternate;}
  .m-ok.danger{background:#000;}
  @keyframes pulse{from{opacity:1;}to{opacity:.55;}}

  /* ---- Archiv-Modal ---- */
  .modal-wide{max-width:440px;}
  .archive-list{
    text-align:left;max-height:60vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:8px;
    -webkit-overflow-scrolling:touch;
  }
  .arch-item{
    border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;background:var(--grey);
  }
  .arch-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px;}
  .arch-team{font-size:15px;font-weight:800;}
  .arch-when{font-size:11px;color:var(--muted);white-space:nowrap;}
  .arch-meta{font-size:12px;color:#555;line-height:1.4;margin-bottom:8px;}
  .arch-actions{display:flex;gap:8px;}
  .arch-actions button{
    flex:1;padding:9px 6px;border-radius:8px;
    border:1.5px solid var(--black);background:var(--white);color:var(--black);
    font-family:inherit;font-size:12px;font-weight:800;
    text-transform:uppercase;letter-spacing:.3px;cursor:pointer;
  }
  .arch-actions button:active{background:#000;color:#fff;}
</style>
</head>
<body>

<header>
  <img id="hdrLogo" src="assets/logo-horizontal-white.png" alt="Bear Performance">
  <div class="title">20m Shuttle Beep Run Test</div>
  <div class="subtitle">BEAR PERFORMANCE <span class="ver">v1.1</span></div>
</header>

<div class="wrap">

  <!-- Bedingungen -->
  <div class="card">
    <div class="field" style="margin-bottom:0;">
      <label for="gTeam">Mannschaft (global)</label>
      <input id="gTeam" list="teams" placeholder="z. B. U14" autocomplete="off">
      <datalist id="teams">
        <option value="U10"><option value="U11"><option value="U12">
        <option value="U13"><option value="U14"><option value="U15">
        <option value="U16"><option value="U17"><option value="U18">
      </datalist>
    </div>

    <button type="button" class="cond-toggle" id="condToggle" aria-expanded="false">
      <span id="condSummary">Datum · Uhrzeit · Temperatur · Notizen</span>
      <span class="chev" id="condChev">▾</span>
    </button>

    <div id="condBody" class="cond-body" hidden>
      <div class="field">
        <label for="gDate">Datum</label>
        <input id="gDate" type="date">
      </div>
      <div class="grid2" style="margin-bottom:10px;">
        <div>
          <label for="gTime">Uhrzeit</label>
          <input id="gTime" type="time">
        </div>
        <div>
          <label for="gTemp">Temperatur °C</label>
          <input id="gTemp" type="number" inputmode="decimal" placeholder="z. B. 18">
        </div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label for="gNotes">Besondere Bedingungen / Notizen</label>
        <input id="gNotes" type="text" placeholder="z. B. nasser Platz, Wind, Halle …">
      </div>
    </div>
  </div>

  <!-- Athleten -->
  <div class="card">
    <h2>Athleten</h2>
    <div id="athletes"></div>
    <button class="add-btn" id="addBtn">+ Athlet hinzufügen</button>
    <div class="hint">Start 10,0 · Schritte 0,5 · Wert = km/h</div>
  </div>

  <!-- Log / gespeicherte Tests (Sitzung) -->
  <div class="card" id="logCard" hidden>
    <h2>Gespeicherte Tests</h2>
    <div id="log"></div>
    <div class="hint">Verlauf dieser Sitzung · dauerhaft in Firestore gespeichert</div>
  </div>

</div>

<div class="exportbar">
  <button class="save" id="saveBtn">💾 Test speichern</button>
  <div class="exportrow">
    <button class="pdf" id="pdfBtn">📄 PDF</button>
    <button class="csv" id="csvBtn">📊 CSV</button>
    <button class="arch" id="archBtn">🗄 Archiv</button>
  </div>
</div>

<!-- Doppel-Bestätigung-Modal -->
<div id="modal" class="modal-ov" hidden>
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-actions">
      <button id="modalCancel" class="m-cancel">Abbrechen</button>
      <button id="modalOk" class="m-ok">Bestätigen</button>
    </div>
  </div>
</div>

<!-- Speichern-Modal (Testleiter + Gehilfen) -->
<div id="saveModal" class="modal-ov" hidden>
  <div class="modal">
    <div class="modal-title">Test speichern</div>
    <div class="field" style="text-align:left;margin-bottom:12px;">
      <label for="mLeader">Testleiter</label>
      <input id="mLeader" type="text" placeholder="Name des Testleiters">
    </div>
    <div class="field" style="text-align:left;margin-bottom:14px;">
      <label for="mHelpers">Gehilfen</label>
      <input id="mHelpers" type="text" placeholder="z. B. Max M., Anna K. (Komma-getrennt)">
    </div>
    <div id="saveStatus" class="modal-msg" style="margin-bottom:12px;"></div>
    <div class="modal-actions">
      <button id="saveCancel" class="m-cancel">Abbrechen</button>
      <button id="saveOk" class="m-ok">Speichern</button>
    </div>
  </div>
</div>

<!-- Abbruch-Modal (Notiz) -->
<div id="abortModal" class="modal-ov" hidden>
  <div class="modal">
    <div class="modal-title">Abbruch</div>
    <div class="modal-msg" id="abortWho" style="margin-bottom:12px;"></div>
    <div class="field" style="text-align:left;margin-bottom:14px;">
      <label for="mAbortNote">Notiz zum Abbruch</label>
      <textarea id="mAbortNote" rows="3" placeholder="z. B. Verletzung, vorzeitig aufgegeben, Krämpfe …"></textarea>
    </div>
    <div class="modal-actions">
      <button id="abortCancel" class="m-cancel">Zurück</button>
      <button id="abortOk" class="m-ok danger">Abbruch setzen</button>
    </div>
  </div>
</div>

<!-- Archiv-Modal (alte Tests aus Firestore) -->
<div id="archiveModal" class="modal-ov" hidden>
  <div class="modal modal-wide">
    <div class="modal-title">Archiv — gespeicherte Tests</div>
    <div id="archiveList" class="archive-list"></div>
    <div class="modal-actions" style="margin-top:14px;">
      <button id="archiveClose" class="m-cancel">Schließen</button>
      <button id="archiveReload" class="m-ok">Neu laden</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var START = 10.0;
  var STEP  = 0.5;
  var MIN   = 10.0;   // unterhalb des Startwerts nicht sinnvoll
  var athletes = []; // {id, name, team, value, finished}
  var seq = 0;
  var lead = '';     // Testleiter
  var helpers = '';  // Gehilfen
  var savedTests = []; // Sitzungs-Log

  var $ = function(id){ return document.getElementById(id); };

  function fmt(v){ return v.toFixed(1).replace('.', ','); } // 10,0

  // ---- Athleten-Rendering ----
  function render(){
    var box = $('athletes');
    box.innerHTML = '';
    athletes.forEach(function(a, i){
      var locked = a.finished || a.aborted;
      var cls = a.aborted ? ' aborted' : (a.finished ? ' finished' : '');
      var finBtn = a.aborted ? '⛔' : (a.finished ? '✓' : '🏁');
      var finCls = (a.finished || a.aborted) ? ' active' : '';

      var wrap = document.createElement('div');
      wrap.className = 'athlete-wrap';
      wrap.innerHTML =
        '<div class="swipe-actions">'+
          '<button class="swipe-abort" title="Abbruch">⛔ Abbruch</button>'+
          '<button class="swipe-del" title="Löschen">🗑 Löschen</button>'+
        '</div>'+
        '<div class="athlete'+cls+'">'+
          '<span class="idx">'+(i+1)+'</span>'+
          '<input class="name" type="text" placeholder="Name" value="'+escAttr(a.name)+'">'+
          '<button class="btn minus" aria-label="minus"'+(locked?' disabled':'')+'>−</button>'+
          '<span class="val num">'+fmt(a.value)+'</span>'+
          '<button class="btn plus" aria-label="plus"'+(locked?' disabled':'')+'>+</button>'+
          '<button class="btn finish'+finCls+'" aria-label="abschliessen" title="Test abschliessen">'+finBtn+'</button>'+
        '</div>';

      var el = wrap.querySelector('.athlete');

      el.querySelector('.name').addEventListener('input', function(e){ a.name = e.target.value; });
      el.querySelector('.plus').addEventListener('click', function(){
        if(a.finished || a.aborted) return;
        a.value = Math.round((a.value + STEP) * 10) / 10;
        updateVal(el, a);
      });
      el.querySelector('.minus').addEventListener('click', function(){
        if(a.finished || a.aborted) return;
        a.value = Math.round((a.value - STEP) * 10) / 10; // keine Untergrenze
        updateVal(el, a);
      });
      el.querySelector('.finish').addEventListener('click', function(){
        // Abschliessen schaltet um; hebt einen Abbruch auf
        a.aborted = false; a.abortNote = '';
        a.finished = !a.finished;
        render();
      });
      wrap.querySelector('.swipe-abort').addEventListener('click', function(){
        openAbortModal(a);
      });
      wrap.querySelector('.swipe-del').addEventListener('click', function(){
        confirmDelete(a);
      });

      attachSwipe(wrap, el);
      box.appendChild(wrap);
    });
  }

  function updateVal(el, a){
    el.querySelector('.num').textContent = fmt(a.value);
  }

  // ---- Wisch-nach-links: Abbruch + Löschen ----
  var OPEN_X = -176;
  function closeAllSwipes(except){
    document.querySelectorAll('.athlete-wrap .athlete').forEach(function(el){
      if(el !== except){ el.style.transition='transform .18s'; el.style.transform='translateX(0)'; el.dataset.open='0'; }
    });
  }
  function attachSwipe(wrap, el){
    var startX=0, startY=0, baseX=0, dragging=false, decided=false, horiz=false;
    el.dataset.open='0';
    el.addEventListener('touchstart', function(e){
      if(e.touches.length>1) return;
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
      baseX = el.dataset.open==='1' ? OPEN_X : 0;
      dragging=true; decided=false; horiz=false;
      el.style.transition='none';
    }, {passive:true});
    el.addEventListener('touchmove', function(e){
      if(!dragging) return;
      var dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
      if(!decided){
        if(Math.abs(dx)>8 || Math.abs(dy)>8){ decided=true; horiz=Math.abs(dx)>Math.abs(dy); }
      }
      if(!horiz) return;
      e.preventDefault();
      var tx=Math.max(OPEN_X, Math.min(0, baseX+dx));
      el.style.transform='translateX('+tx+'px)';
    }, {passive:false});
    function end(){
      if(!dragging) return;
      dragging=false;
      var m=/translateX\((-?\d+(?:\.\d+)?)px\)/.exec(el.style.transform);
      var cur=m?parseFloat(m[1]):0;
      var open = cur < OPEN_X/2;
      el.style.transition='transform .18s';
      el.style.transform='translateX('+(open?OPEN_X:0)+'px)';
      el.dataset.open=open?'1':'0';
      if(open) closeAllSwipes(el);
    }
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
  }

  function confirmDelete(a){
    var nm = a.name.trim() || 'dieser Athlet';
    doubleConfirm({
      title:'Athlet löschen',
      message:'„'+nm+'" wirklich löschen?',
      confirm:'Löschen',
      confirm2:'Endgültig löschen — nochmal tippen',
      danger:true
    }).then(function(ok){
      if(ok){
        athletes = athletes.filter(function(x){ return x.id !== a.id; });
        render();
      } else {
        closeAllSwipes(null);
      }
    });
  }

  // ---- Abbruch (mit Notiz) ----
  var abortTarget = null;
  function openAbortModal(a){
    abortTarget = a;
    $('abortWho').textContent = '„'+(a.name.trim() || 'dieser Athlet')+'" — bei '+fmt(a.value)+' km/h';
    $('mAbortNote').value = a.abortNote || '';
    $('abortModal').hidden = false;
    setTimeout(function(){ $('mAbortNote').focus(); }, 50);
  }
  function closeAbortModal(){ $('abortModal').hidden = true; abortTarget = null; closeAllSwipes(null); }
  function doAbort(){
    if(!abortTarget) return;
    abortTarget.aborted = true;
    abortTarget.finished = false;
    abortTarget.abortNote = $('mAbortNote').value.trim();
    $('abortModal').hidden = true;
    abortTarget = null;
    render();
  }

  function addAthlete(){
    athletes.push({ id: ++seq, name:'', team:'', value:START, finished:false, aborted:false, abortNote:'' });
    render();
    // Fokus auf neues Namensfeld
    var inputs = document.querySelectorAll('.athlete .name');
    if(inputs.length){ inputs[inputs.length-1].focus(); }
  }

  function escAttr(s){ return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---- Test speichern (Testleiter/Gehilfen abfragen -> Firestore) ----
  function openSaveModal(){
    if(!validate()) return;
    var offen = athletes.filter(function(a){ return !a.finished && !a.aborted; });
    if(offen.length){
      alert('Bitte zuerst ALLE Athleten abschließen (🏁) oder auf Abbruch setzen (nach links wischen).\n\nNoch offen: '+offen.length+' von '+athletes.length+'.');
      return;
    }
    $('mLeader').value = lead;
    $('mHelpers').value = helpers;
    $('saveStatus').textContent = '';
    var ok = $('saveOk'); ok.disabled = false; ok.textContent = 'Speichern';
    $('saveModal').hidden = false;
    setTimeout(function(){ $('mLeader').focus(); }, 50);
  }
  function closeSaveModal(){ $('saveModal').hidden = true; }

  function doSave(){
    lead    = $('mLeader').value.trim();
    helpers = $('mHelpers').value.trim();
    if(!lead){ $('saveStatus').textContent = 'Bitte Testleiter eingeben.'; $('mLeader').focus(); return; }

    var m = meta();
    var rec = {
      title: '20m Shuttle Beep Run Test',
      team: m.team || '', date: m.date || '', time: m.time || '',
      temp: m.temp || '', notes: m.notes || '',
      lead: lead, helpers: helpers,
      athletes: athletes.map(function(a){
        return { name: a.name.trim(), value: a.value, speed: fmt(a.value),
                 finished: !!a.finished, aborted: !!a.aborted, abortNote: a.aborted ? (a.abortNote||'') : '' };
      }),
      savedAt: new Date().toISOString()
    };

    var ok = $('saveOk');
    ok.disabled = true; ok.textContent = 'Speichert …';
    $('saveStatus').textContent = 'Speichere in Firestore …';

    function done(status){
      rec.synced = (status === 'ok');
      savedTests.unshift(rec);
      renderLog();
      closeSaveModal();
    }

    if(fbDb){
      try {
        if(firebase.firestore.FieldValue){ rec.createdAt = firebase.firestore.FieldValue.serverTimestamp(); }
        fbDb.collection('beeptests').add(rec)
          .then(function(){ done('ok'); })
          .catch(function(){
            $('saveStatus').textContent = 'Firestore nicht erreichbar — lokal im Verlauf gespeichert.';
            setTimeout(function(){ done('local'); }, 900);
          });
      } catch(e){ done('local'); }
    } else {
      done('local');
    }
  }

  function renderLog(){
    var card = $('logCard'), box = $('log');
    if(!savedTests.length){ card.hidden = true; return; }
    card.hidden = false;
    box.innerHTML = '';
    savedTests.forEach(function(r){
      var done = r.athletes.filter(function(a){ return a.finished; }).length;
      var el = document.createElement('div');
      el.className = 'log-item';
      el.innerHTML =
        '<div class="log-head">'+
          '<span class="log-team">'+escHtml(r.team || '—')+'</span>'+
          '<span class="log-sync">'+(r.synced ? '☁︎ Firestore' : '⚠︎ lokal')+'</span>'+
        '</div>'+
        '<div class="log-meta">'+escHtml(r.date)+(r.time?' · '+escHtml(r.time):'')+' · '+r.athletes.length+' Athleten · '+done+' abgeschlossen</div>'+
        '<div class="log-meta">Testleiter: '+escHtml(r.lead || '—')+(r.helpers?' · Gehilfen: '+escHtml(r.helpers):'')+'</div>';
      box.appendChild(el);
    });
  }

  // ---- Archiv (alte Tests aus Firestore laden + re-download) ----
  var archiveRecords = [];
  function openArchive(){
    $('archiveModal').hidden = false;
    loadArchive();
  }
  function closeArchive(){ $('archiveModal').hidden = true; }
  function loadArchive(){
    var body = $('archiveList');
    if(!fbDb){ body.innerHTML = '<div class="hint" style="text-align:left;">Firestore nicht verfügbar — Archiv kann nicht geladen werden.</div>'; return; }
    body.innerHTML = '<div class="hint" style="text-align:left;">Lade gespeicherte Tests …</div>';
    fbDb.collection('beeptests').orderBy('savedAt','desc').limit(100).get()
      .then(function(qs){
        archiveRecords = [];
        qs.forEach(function(doc){
          var d = doc.data();
          if(d && d._verify) return; // Verify-Testdocs ignorieren
          d._id = doc.id; archiveRecords.push(d);
        });
        renderArchive();
      })
      .catch(function(e){
        body.innerHTML = '<div class="hint" style="text-align:left;">Fehler beim Laden: '+escHtml((e&&e.code)||String(e))+'</div>';
      });
  }
  function renderArchive(){
    var body = $('archiveList');
    if(!archiveRecords.length){ body.innerHTML = '<div class="hint" style="text-align:left;">Noch keine gespeicherten Tests im Archiv.</div>'; return; }
    body.innerHTML = '';
    archiveRecords.forEach(function(rec, idx){
      var aths = rec.athletes || [];
      var done = aths.filter(function(a){ return a.finished; }).length;
      var abr  = aths.filter(function(a){ return a.aborted; }).length;
      var el = document.createElement('div');
      el.className = 'arch-item';
      el.innerHTML =
        '<div class="arch-head">'+
          '<span class="arch-team">'+escHtml(rec.team || '—')+'</span>'+
          '<span class="arch-when">'+escHtml(rec.date||'')+(rec.time?' · '+escHtml(rec.time):'')+'</span>'+
        '</div>'+
        '<div class="arch-meta">'+aths.length+' Athleten · '+done+' abgeschlossen'+(abr?' · '+abr+' Abbruch':'')+'<br>'+
          'Testleiter: '+escHtml(rec.lead||'—')+(rec.helpers?' · Gehilfen: '+escHtml(rec.helpers):'')+'</div>'+
        '<div class="arch-actions">'+
          '<button data-i="'+idx+'" data-k="pdf">📄 PDF</button>'+
          '<button data-i="'+idx+'" data-k="csv">📊 CSV</button>'+
        '</div>';
      el.querySelectorAll('.arch-actions button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var rec = archiveRecords[+btn.getAttribute('data-i')];
          var d = recordData(rec);
          if(btn.getAttribute('data-k')==='pdf') buildPDF(d); else buildCSV(d);
        });
      });
      body.appendChild(el);
    });
  }

  // ---- Meta einlesen ----
  function meta(){
    var d = $('gDate').value;
    var dateStr = d ? d.split('-').reverse().join('.') : '';
    return {
      team:  $('gTeam').value.trim(),
      date:  dateStr,
      time:  $('gTime').value.trim(),
      temp:  $('gTemp').value.trim(),
      notes: $('gNotes').value.trim(),
      lead:  lead,
      helpers: helpers
    };
  }

  function statusOf(a){ return a.aborted ? 'Abbruch' : (a.finished ? 'Abgeschlossen' : 'offen'); }

  // Export-Daten aus aktuellem App-Zustand
  function liveData(){
    var m = meta();
    return {
      team:m.team, date:m.date, time:m.time, temp:m.temp, notes:m.notes, lead:m.lead, helpers:m.helpers,
      rows: athletes.map(function(a){
        return {
          name: a.name.trim() || '—',
          team: (m.team || '—'),
          value: fmt(a.value),
          status: statusOf(a),
          note: a.aborted ? (a.abortNote||'') : ''
        };
      })
    };
  }
  // Export-Daten aus gespeichertem Firestore-/Log-Datensatz
  function recordData(rec){
    return {
      team:rec.team||'', date:rec.date||'', time:rec.time||'', temp:rec.temp||'', notes:rec.notes||'',
      lead:rec.lead||'', helpers:rec.helpers||'',
      rows: (rec.athletes||[]).map(function(a){
        var st = a.aborted ? 'Abbruch' : (a.finished ? 'Abgeschlossen' : 'offen');
        return {
          name: (a.name||'').trim() || '—',
          team: (rec.team || '—'),
          value: a.speed || fmt(a.value||0),
          status: st,
          note: a.aborted ? (a.abortNote||'') : ''
        };
      })
    };
  }

  function validate(){
    if(athletes.length === 0){ alert('Bitte zuerst mindestens einen Athleten hinzufügen.'); return false; }
    return true;
  }

  // ---- Doppel-Bestätigung (Zwei-Stufen-Modal) ----
  function doubleConfirm(opts){
    return new Promise(function(resolve){
      var ov = $('modal');
      var ok = $('modalOk'), cancel = $('modalCancel');
      $('modalTitle').textContent = opts.title || 'Bestätigen';
      $('modalMsg').textContent = opts.message || '';
      ok.textContent = opts.confirm || 'Bestätigen';
      ok.className = 'm-ok' + (opts.danger ? ' danger' : '');
      var stage = 1;
      ov.hidden = false;

      function cleanup(){
        ov.hidden = true;
        ok.onclick = null; cancel.onclick = null; ov.onclick = null;
      }
      ok.onclick = function(){
        if(stage === 1){
          stage = 2;
          ok.textContent = opts.confirm2 || 'Wirklich? — nochmal tippen';
          ok.classList.add('armed');
        } else {
          cleanup(); resolve(true);
        }
      };
      cancel.onclick = function(){ cleanup(); resolve(false); };
      ov.onclick = function(e){ if(e.target === ov){ cleanup(); resolve(false); } };
    });
  }

  // ---- CSV ----
  function exportCSV(){
    if(!validate()) return;
    doubleConfirm({
      title:'CSV erstellen',
      message:'CSV-Datei jetzt erzeugen?',
      confirm:'CSV erstellen',
      confirm2:'Wirklich erstellen — nochmal tippen'
    }).then(function(ok){ if(ok) buildCSV(liveData()); });
  }
  function buildCSV(d){
    var sep = ';';
    var L = [];
    L.push('20m Shuttle Beep Run Test');
    L.push('Mannschaft (global)'+sep+ csv(d.team));
    L.push('Datum'+sep+ csv(d.date));
    L.push('Uhrzeit'+sep+ csv(d.time));
    L.push('Temperatur (°C)'+sep+ csv(d.temp));
    L.push('Testleiter'+sep+ csv(d.lead));
    L.push('Gehilfen'+sep+ csv(d.helpers));
    L.push('Besondere Bedingungen'+sep+ csv(d.notes));
    L.push('');
    L.push(['Name','Mannschaft','Geschwindigkeit (km/h)','Status','Notiz (Abbruch)'].join(sep));
    d.rows.forEach(function(r){
      L.push([csv(r.name), csv(r.team), csv(r.value), csv(r.status), csv(r.note)].join(sep));
    });
    var content = '﻿' + L.join('\r\n'); // BOM für Umlaute in Excel
    download(new Blob([content], {type:'text/csv;charset=utf-8;'}), filename('csv', d));
  }

  function csv(v){
    v = (v==null)?'':String(v);
    if(/[";\r\n]/.test(v)){ v = '"' + v.replace(/"/g,'""') + '"'; }
    return v;
  }

  // ---- PDF ----
  function exportPDF(){
    if(!validate()) return;
    doubleConfirm({
      title:'PDF erstellen',
      message:'PDF-Datei jetzt erzeugen?',
      confirm:'PDF erstellen',
      confirm2:'Wirklich erstellen — nochmal tippen'
    }).then(function(ok){ if(ok) buildPDF(liveData()); });
  }
  function buildPDF(m){
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({unit:'mm', format:'a4'});
    var pw = doc.internal.pageSize.getWidth();
    var ML = 15;
    var y = 14;

    // Logo (schwarz, auf weiß)
    if(logoData){
      var lw = 50, lh = lw * (750/1920);
      doc.addImage(logoData, 'PNG', (pw-lw)/2, y, lw, lh);
      y += lh + 6;
    } else {
      y += 4;
    }

    doc.setFont('helvetica','bold');
    doc.setFontSize(15);
    doc.setTextColor(0,0,0);
    doc.text('20m Shuttle Beep Run Test', pw/2, y, {align:'center'});
    y += 9;

    // Bedingungen-Block
    doc.setDrawColor(0); doc.setLineWidth(0.4);
    doc.line(ML, y, pw-ML, y); y += 6;

    doc.setFontSize(10);
    function metaLine(lbl, val){
      doc.setFont('helvetica','bold'); doc.text(lbl, ML, y);
      doc.setFont('helvetica','normal'); doc.text(val||'—', ML+42, y);
      y += 6;
    }
    metaLine('Mannschaft:', m.team);
    metaLine('Datum:', m.date);
    metaLine('Uhrzeit:', m.time);
    metaLine('Temperatur:', m.temp ? (m.temp+' °C') : '');
    metaLine('Testleiter:', m.lead);
    metaLine('Gehilfen:', m.helpers);
    // Notizen ggf. mehrzeilig
    doc.setFont('helvetica','bold'); doc.text('Bedingungen:', ML, y);
    doc.setFont('helvetica','normal');
    var noteLines = doc.splitTextToSize(m.notes || '—', pw - ML - ML - 42);
    doc.text(noteLines, ML+42, y);
    y += Math.max(6, noteLines.length*5) + 2;

    doc.line(ML, y, pw-ML, y); y += 4;

    // Tabelle
    doc.autoTable({
      startY: y,
      head: [['#','Name','km/h','Status / Notiz']],
      body: m.rows.map(function(r,i){
        var st = r.status === 'Abbruch' ? ('Abbruch' + (r.note ? ' — '+r.note : '')) : r.status;
        return [String(i+1), r.name, r.value, st];
      }),
      theme:'grid',
      styles:{ font:'helvetica', fontSize:10, textColor:[0,0,0], lineColor:[0,0,0], lineWidth:0.2, cellPadding:2.5 },
      headStyles:{ fillColor:[0,0,0], textColor:[255,255,255], fontStyle:'bold' },
      alternateRowStyles:{ fillColor:[245,245,245] },
      columnStyles:{ 0:{cellWidth:10, halign:'center'}, 2:{cellWidth:20, halign:'center', fontStyle:'bold'}, 3:{cellWidth:58} },
      margin:{left:ML, right:ML}
    });

    // Footer
    var fy = doc.internal.pageSize.getHeight() - 8;
    doc.setFontSize(8); doc.setTextColor(120);
    doc.text('Bear Performance — erstellt am '+ nowStamp(), pw/2, fy, {align:'center'});

    doc.save(filename('pdf', m));
  }

  // ---- Helpers ----
  function filename(ext, d){
    d = d || meta();
    var clean = function(s){ return (s||'').replace(/[^\wÄÖÜäöüß.\-]+/g,'_').replace(/^_+|_+$/g,''); };
    var t = clean(d.team) || 'Mannschaft';
    var dt = (d.date || 'Datum').replace(/\./g,'-');   // 27.06.2026 -> 27-06-2026
    var u = (d.time || '').replace(/:/g,'-') || 'Uhrzeit'; // 09:05 -> 09-05
    return 'beeptest-'+t+'-'+dt+'-'+u+'.'+ext;
  }
  function nowStamp(){
    var n = new Date();
    function p(x){ return (x<10?'0':'')+x; }
    return p(n.getDate())+'.'+p(n.getMonth()+1)+'.'+n.getFullYear()+' '+p(n.getHours())+':'+p(n.getMinutes());
  }
  function download(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }

  // ---- Logo für PDF (schwarz) als base64 vorladen ----
  var logoData = null;
  (function loadLogo(){
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try{
        var maxW = 600; // herunterskalieren -> kleineres PDF
        var scale = Math.min(1, maxW / img.naturalWidth);
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);
        logoData = c.toDataURL('image/png');
      }catch(e){ logoData = null; } // file:// CORS -> PDF ohne Logo
    };
    img.onerror = function(){ logoData = null; };
    img.src = 'assets/logo-horizontal-black.png';
  })();

  // ---- Init ----
  function initDateTime(){
    var n = new Date();
    function p(x){ return (x<10?'0':'')+x; }
    $('gDate').value = n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate());
    $('gTime').value = p(n.getHours())+':'+p(n.getMinutes());
  }

  // Bedingungen ein-/ausklappen
  function updateCondSummary(){
    var m = meta();
    var parts = [];
    if(m.date) parts.push(m.date);
    if(m.time) parts.push(m.time + ' Uhr');
    if(m.temp) parts.push(m.temp + ' °C');
    if(m.notes) parts.push(m.notes);
    $('condSummary').textContent = parts.length ? parts.join('  ·  ') : 'Datum · Uhrzeit · Temperatur · Notizen';
  }
  $('condToggle').addEventListener('click', function(){
    var body = $('condBody');
    var open = body.hidden;
    body.hidden = !open;
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(!open) updateCondSummary(); // beim Zuklappen Zusammenfassung aktualisieren
  });

  $('addBtn').addEventListener('click', addAthlete);
  $('pdfBtn').addEventListener('click', exportPDF);
  $('csvBtn').addEventListener('click', exportCSV);
  $('saveBtn').addEventListener('click', openSaveModal);
  $('saveOk').addEventListener('click', doSave);
  $('saveCancel').addEventListener('click', closeSaveModal);
  $('saveModal').addEventListener('click', function(e){ if(e.target === this) closeSaveModal(); });

  // Abbruch-Modal
  $('abortOk').addEventListener('click', doAbort);
  $('abortCancel').addEventListener('click', closeAbortModal);
  $('abortModal').addEventListener('click', function(e){ if(e.target === this) closeAbortModal(); });

  // Archiv-Modal
  $('archBtn').addEventListener('click', openArchive);
  $('archiveClose').addEventListener('click', closeArchive);
  $('archiveReload').addEventListener('click', loadArchive);
  $('archiveModal').addEventListener('click', function(e){ if(e.target === this) closeArchive(); });

  initDateTime();
  updateCondSummary(); // zeigt das vorbefüllte Datum/Uhrzeit im eingeklappten Zustand
  for(var k=0; k<5; k++){ athletes.push({ id: ++seq, name:'', team:'', value:START, finished:false, aborted:false, abortNote:'' }); }
  render(); // mit 5 Athleten starten (erweiterbar bis 7+)
})();
</script>
</body>
</html>
